<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFA Media Tracker</title>
<style>
:root{
  --ink:#1b2333;        /* header / nav */
  --ink2:#252f45;
  --paper:#f4f4f1;      /* app background */
  --card:#ffffff;
  --line:#e3e3dd;
  --text:#2c3444;
  --mut:#7a8194;
  --media:#3f7a55;      /* media green — matches map app media rentals */
  --media-soft:#e8f1ea;
  --owned:#7c4a7c;      /* store owned purple — matches map app */
  --amber:#c98a1b;
  --amber-soft:#faf3e3;
  --rose:#b8484e;
  --rose-soft:#f9e9ea;
  --blue:#3d6fa8;
  --blue-soft:#e8eff8;
  --dot-nr:#c0453f; --dot-rc:#d9a520; --dot-sc:#3d6fa8; --dot-rn:#3f7a55;
  --rad:8px;
  --shadow:0 1px 3px rgba(27,35,51,.08),0 4px 14px rgba(27,35,51,.05);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:var(--text)}
::selection{background:var(--media-soft)}

/* ── Top bar ─────────────────────────────────────── */
#topbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:52px;flex:none}
#topbar .logo{font-weight:700;letter-spacing:.14em;font-size:.82rem;text-transform:uppercase}
#topbar .logo b{color:#8fd3a8}
#topbar .env{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#8b93a8;border:1px solid #3a4460;border-radius:4px;padding:2px 8px}
#topbar .sp{flex:1}
#globalSearch{background:var(--ink2);border:1px solid #3a4460;border-radius:6px;color:#fff;padding:6px 12px;width:280px;font-size:.85rem}
#globalSearch::placeholder{color:#7d859c}
#topbar .who{width:32px;height:32px;border-radius:50%;background:#3f7a55;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}

/* ── Shell: rail + main ──────────────────────────── */
#shell{flex:1;display:flex;min-height:0}
#rail{width:196px;flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:.88rem;color:#4c5468;text-align:left;width:100%}
.navbtn .ic{width:18px;text-align:center;flex:none}
.navbtn:hover{background:#f2f4f0}
.navbtn.on{background:var(--media-soft);color:var(--media);font-weight:600}
.rail-sec{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#a3a9ba;padding:14px 12px 4px}
#main{flex:1;overflow-y:auto;padding:22px 26px 60px;min-width:0}

/* ── Common bits ─────────────────────────────────── */
.pgtitle{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.pgtitle h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.pgtitle .sub{color:var(--mut);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow)}
.card h2{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#5a627a;padding:14px 18px 0}
.chip{display:inline-flex;align-items:center;gap:5px;background:#f0f1ee;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:.76rem;color:#4c5468;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--media);color:var(--media)}
.pill{display:inline-block;border-radius:4px;padding:2px 8px;font-size:.7rem;font-weight:600;letter-spacing:.03em}
.pill.active{background:var(--media-soft);color:var(--media)}
.pill.draft{background:#eef0f4;color:#5a627a}
.pill.completed{background:var(--blue-soft);color:var(--blue)}
.pill.cancelled{background:var(--rose-soft);color:var(--rose)}
.pill.beauty{background:#f6ecf4;color:#8a4a80}
.pill.swt{background:#f3ede3;color:#8a6a2a}
.pill.wja{background:#e9eef6;color:#3d5a8a}
table.grid{width:100%;border-collapse:collapse;font-size:.85rem}
table.grid th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#8a90a2;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:11px 14px;border-bottom:1px solid #eeeeea;vertical-align:top}
table.grid tr.rowlink{cursor:pointer}
table.grid tr.rowlink:hover td{background:#f7f8f5}
.mut{color:var(--mut)}.sm{font-size:.78rem}.b{font-weight:600}
.money{font-variant-numeric:tabular-nums}

/* ── Status rail (the 4-dot content pipeline) ─────── */
.rail4{display:inline-flex;align-items:center}
.rail4 .d{width:10px;height:10px;border-radius:50%;border:2px solid #cfd2c9;background:#fff;flex:none}
.rail4 .l{width:14px;height:2px;background:#cfd2c9;flex:none}
.rail4 .d.f1{border-color:var(--dot-nr);background:var(--dot-nr)}
.rail4 .d.f2{border-color:var(--dot-rc);background:var(--dot-rc)}
.rail4 .d.f3{border-color:var(--dot-sc);background:var(--dot-sc)}
.rail4 .d.f4{border-color:var(--dot-rn);background:var(--dot-rn)}
.rail4 .l.fl{background:#9aa896}
.rail4wrap{display:inline-flex;flex-direction:column;gap:3px;align-items:flex-start}
.rail4lbl{font-size:.66rem;color:var(--mut);letter-spacing:.02em}

/* ── Filters ─────────────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters label{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#8a90a2}
.filters select,.filters input{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;font-size:.84rem;min-width:130px}
.btn{border-radius:6px;padding:8px 16px;font-size:.84rem;font-weight:600}
.btn.pri{background:var(--media);color:#fff}
.btn.pri:hover{background:#346546}
.btn.ghost{border:1px solid var(--line);background:#fff;color:#4c5468}
.btn.ghost:hover{border-color:#b8bcae}

/* ── Dashboard ───────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer}
.kpi:hover{border-color:#c9cdbf}
.kpi .n{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .t{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#8a90a2;margin-top:2px}
.kpi .d{font-size:.76rem;margin-top:6px}
.dash2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.dash2{grid-template-columns:1fr}}

/* ── Activity feed ───────────────────────────────── */
.feed{padding:6px 18px 16px}
.feed .ev{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #eeeeea}
.feed .ev:last-child{border-bottom:none}
.evtag{flex:none;border-radius:4px;padding:2px 8px;font-size:.66rem;font-weight:700;letter-spacing:.05em;height:fit-content;margin-top:2px}
.evtag.action{background:var(--media-soft);color:var(--media)}
.evtag.notification{background:var(--blue-soft);color:var(--blue)}
.evtag.upload{background:var(--amber-soft);color:var(--amber)}
.ev .meta{font-size:.74rem;color:var(--mut)}
.ev .what{font-size:.86rem;margin-top:2px}
.ev .ctx{font-size:.76rem;color:#5a627a;margin-top:2px;font-weight:600}

/* ── Workflow checklist ──────────────────────────── */
.wf{padding:10px 18px 16px;display:flex;flex-direction:column}
.wf .step{display:flex;gap:12px;padding:9px 12px;border-radius:6px;align-items:flex-start}
.wf .step.done{background:var(--media-soft)}
.wf .cb{width:17px;height:17px;border:2px solid #b9bfae;border-radius:4px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff}
.wf .step.done .cb{background:var(--media);border-color:var(--media)}
.wf .step .t{font-size:.86rem}
.wf .step .t b{font-weight:600}
.wf .step .sub{font-size:.76rem;color:var(--mut)}

/* ── Detail drawer ───────────────────────────────── */
#drawerWrap{position:fixed;inset:0;background:rgba(27,35,51,.35);display:none;z-index:50}
#drawerWrap.open{display:block}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(880px,94vw);background:var(--paper);box-shadow:-8px 0 30px rgba(27,35,51,.25);display:flex;flex-direction:column;animation:slide .18s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#drawer{animation:none}}
#drawerHead{background:var(--ink);color:#fff;padding:16px 22px;display:flex;align-items:flex-start;gap:14px;flex:none}
#drawerHead h2{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
#drawerHead .sub{font-size:.76rem;color:#9aa2b8;margin-top:3px}
#drawerHead .x{margin-left:auto;font-size:1.2rem;color:#9aa2b8;padding:2px 8px}
#drawerHead .x:hover{color:#fff}
#drawerBody{flex:1;overflow-y:auto;padding:18px 22px 50px}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.dgrid{grid-template-columns:1fr}}
.kv{padding:8px 18px 16px}
.kv .row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid #eeeeea;font-size:.86rem}
.kv .row:last-child{border:none}
.kv .k{width:170px;flex:none;color:#5a627a;font-weight:600;text-align:right}
.kv .v{flex:1;min-width:0}
.stack>*{margin-bottom:16px}

/* ── Calendar: promo grid ────────────────────────── */
.calwrap{overflow-x:auto}
table.cal{border-collapse:collapse;font-size:.78rem;min-width:900px;width:100%}
table.cal th{background:#f0f1ec;border:1px solid var(--line);padding:7px 10px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#5a627a}
table.cal td{border:1px solid var(--line);vertical-align:top;padding:0;height:54px;background:#fff}
table.cal td.spacehead{background:#fafaf7;padding:8px 10px;font-weight:700;font-size:.76rem;white-space:nowrap;width:130px}
table.cal td.spacehead .loc{display:block;font-weight:400;color:var(--mut);font-size:.68rem}
.bkg{margin:3px;border-radius:5px;padding:5px 8px;font-size:.72rem;line-height:1.3;cursor:pointer;border-left:3px solid var(--media);background:var(--media-soft)}
.bkg:hover{filter:brightness(.97)}
.bkg .bn{font-weight:700}
.bkg .st{color:#5a627a}
.bkg.owned{border-left-color:var(--owned);background:#f3ecf3}
.bkg.pending{border-left-color:var(--amber);background:var(--amber-soft)}
.calmode{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.calmode button{padding:7px 14px;font-size:.8rem;background:#fff;color:#5a627a}
.calmode button.on{background:var(--ink);color:#fff}

/* ── Asset/slot calendar ─────────────────────────── */
table.slotcal td.assetcell{width:230px;background:#fafaf7;padding:8px 10px}
table.slotcal .an{font-weight:700;font-size:.78rem}
table.slotcal .ac{font-size:.68rem;color:var(--mut)}
table.slotcal td.slotlbl{width:150px;background:#fdfdfb;padding:6px 10px;font-size:.7rem;border-left:3px solid var(--media)}
table.slotcal td.slotlbl .so{color:var(--mut)}

/* ── Booking calendar ────────────────────────────── */
table.cal.bk{min-width:1180px}
table.cal.bk td.bkn,table.cal.bk th.bkn{width:196px;min-width:196px;position:sticky;left:0;z-index:2;background:#fafaf7;padding:7px 10px;font-size:.76rem;cursor:pointer;border-right:1px solid var(--line)}
table.cal.bk .bks{display:block;font-weight:400;color:var(--mut);font-size:.66rem}
/* The cell is a column of slices. One booking per slice, flex-sized by the
   share of the loop it holds, so the picture of a screen's month is the
   picture of how it was sold. The inner wrapper takes the row's full height
   so a single booking fills its cell instead of leaving a gap under it. */
table.cal.bk td.bkc{min-width:92px;padding:0;cursor:pointer;height:1px}
table.cal.bk td.bkc > .slices{display:flex;flex-direction:column;height:100%;min-height:44px}
table.cal.bk td.bkc .slice{display:flex;flex-direction:column;justify-content:center;
  padding:4px 7px;min-height:22px;border-left:3px solid transparent;font-size:.71rem;line-height:1.2;overflow:hidden}
table.cal.bk td.bkc .slice + .slice{border-top:1px solid rgba(255,255,255,.9)}
table.cal.bk td.bkc .slice.bkd{background:var(--media-soft);border-left-color:var(--media)}
table.cal.bk td.bkc .slice.bkd:hover{filter:brightness(.94)}
table.cal.bk td.bkc .slice.bkd.gr{background:#f3ecf3;border-left-color:var(--owned)}
table.cal.bk td.bkc .slice.plan{background:var(--amber-soft);border-left:3px dashed var(--amber)}
table.cal.bk td.bkc .slice.open{background:repeating-linear-gradient(135deg,#f4f4f0,#f4f4f0 4px,#fbfbf9 4px,#fbfbf9 8px);
  color:var(--mut);align-items:center;justify-content:center;flex:1}
table.cal.bk td.bkc .bn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.cal.bk td.bkc .bs{color:#5a627a;font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-g{display:inline-block;color:#fff;font-weight:700;font-size:.63rem;border-radius:3px;padding:1px 4px;font-variant-numeric:tabular-nums}
table.cal.bk td.bkt{text-align:right;font-variant-numeric:tabular-nums;font-size:.74rem;padding:6px 8px;white-space:nowrap;background:#fff;vertical-align:middle}
table.cal.bk tr.bkgrp td,table.grid tr.bkgrp td{background:#f0f1ec;font-weight:700;font-size:.72rem;color:#5a627a;height:auto;padding:6px 10px}
table.cal.bk tr.bkgrp td.bkn{z-index:2}
table.cal.bk tr.bksum td{background:#f7f4ec;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;height:auto;padding:7px 8px;font-size:.76rem;vertical-align:middle}
table.cal.bk tr.bksum td.bkn{text-align:left;cursor:default;font-size:.74rem}
table.cal.bk tr.bksum td.bkn .bks{font-weight:400;font-size:.64rem}
.bklegend{font-size:.76rem;color:var(--mut);margin-top:10px;line-height:1.8}
.bklegend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin:0 4px 0 14px}
.bklegend .sw:first-child{margin-left:0}
.bklegend .sw.b{background:var(--media-soft);border-left:3px solid var(--media)}
.bklegend .sw.pl{background:var(--amber-soft);border-left:3px dashed var(--amber)}
.bklegend .sw.o{background:repeating-linear-gradient(135deg,#f4f4f0,#f4f4f0 3px,#fff 3px,#fff 6px);border:1px solid var(--line)}
.ghostbar,.warnbar{border-radius:var(--rad);padding:9px 13px;font-size:.8rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.ghostbar{background:#f0f1ec;color:#5a627a}
.warnbar{background:var(--rose-soft);color:#7a2a2e;border-left:3px solid var(--rose)}
.note{border-radius:var(--rad)}

/* ── Brand sales growth ──────────────────────────── */
.grow{display:flex;align-items:baseline;gap:12px;padding:14px 18px 10px}
.grow .gv{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.grow .gl{font-size:.8rem;color:var(--mut)}
.up{color:var(--media)} .down{color:var(--rose)}
table.cal.bk td.bkc .bs .up,table.cal.bk td.bkc .bs .down{font-weight:700}
.grow .gv.up{color:var(--media)} .grow .gv.down{color:var(--rose)}

/* ── Data health ─────────────────────────────────── */
.hitem{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:var(--rad);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:12px}
.hitem.ok{border-left-color:var(--media)}
.hitem.warn{border-left-color:var(--amber)}
.hitem.bad{border-left-color:var(--rose)}
.hhead{display:flex;align-items:center;gap:9px;font-size:.95rem;margin-bottom:8px}
.hdot{width:9px;height:9px;border-radius:50%;flex:none}
.hitem.ok .hdot{background:var(--media)} .hitem.warn .hdot{background:var(--amber)} .hitem.bad .hdot{background:var(--rose)}
.hcount{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem}
.hbody{font-size:.82rem;color:#4c5468;line-height:1.6}
.hbody p{margin:0 0 6px}
.hbody table.grid{margin-top:6px}
.hul{margin:4px 0 6px 18px}

/* ── Rate cards / packages ───────────────────────── */
.pkcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.pk .nm{font-weight:700;font-size:.92rem}
.pk .rate{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.pk .rate span{font-size:.72rem;font-weight:400;color:var(--mut)}
.pk .inc{font-size:.78rem;color:#5a627a;line-height:1.5}
.pk .foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}

/* ── DAM ─────────────────────────────────────────── */
.damprov{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px}
.damopt{border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:190px;cursor:pointer;background:#fff}
.damopt.on{border-color:var(--media);background:var(--media-soft)}
.damopt .n{font-weight:700;font-size:.88rem}
.damopt .d{font-size:.72rem;color:var(--mut);margin-top:2px}
.damstat{font-size:.72rem;margin-top:6px;font-weight:600}
.damstat.ok{color:var(--media)}.damstat.warn{color:var(--amber)}
.note{font-size:.78rem;color:#5a627a;background:var(--amber-soft);border:1px solid #ecd9ae;border-radius:6px;padding:10px 14px;line-height:1.5}
.thumb{width:44px;height:44px;border-radius:6px;background:linear-gradient(135deg,#2b3350,#3f7a55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;letter-spacing:.05em;flex:none}

/* ── Deal stepper (business pipeline) ─────────────── */
.dealwrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.dealstep{font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:#8a90a2;background:#fff;cursor:pointer;white-space:nowrap}
.dealstep:hover{border-color:#b8bcae}
.dealstep.on{color:#fff;border-color:transparent}
.dealstep.cancelled{color:#fff;background:var(--rose);border-color:transparent}
.dealpill{display:inline-block;border-radius:4px;padding:2px 9px;font-size:.7rem;font-weight:700;color:#fff}

.empty{padding:34px;text-align:center;color:var(--mut);font-size:.86rem}
a.lnk{color:var(--blue);text-decoration:none}
a.lnk:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--media);outline-offset:1px}

/* ── Modal (new booking) ─────────────────────────── */
#modalWrap{position:fixed;inset:0;background:rgba(27,35,51,.4);display:none;z-index:60;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
#modalWrap.open{display:flex}
#modal{background:var(--paper);border-radius:10px;width:min(680px,100%);box-shadow:0 20px 60px rgba(27,35,51,.35)}
#modal .mh{background:var(--ink);color:#fff;border-radius:10px 10px 0 0;padding:14px 20px;display:flex;align-items:center}
#modal .mh h2{font-size:.95rem;font-weight:700}
#modal .mh .x{margin-left:auto;color:#9aa2b8;font-size:1.1rem;padding:2px 8px}
#modal .mh .x:hover{color:#fff}
#modal .mb{padding:18px 20px 22px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.formgrid .full{grid-column:1/-1}
.formgrid .f{display:flex;flex-direction:column;gap:4px}
.formgrid label{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#8a90a2}
.formgrid input,.formgrid select,.formgrid textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;font-size:.86rem;width:100%}
.formfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.wf .step{cursor:pointer}
.wf .step:hover{background:#f2f4f0}
.wf .step.done:hover{background:#dcebe1}
.dirty{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}
.topbtn{border:1px solid #3a4460;border-radius:6px;padding:6px 13px;font-size:.8rem;color:#cfd4e2;font-weight:600}
.topbtn:hover{border-color:#8fd3a8;color:#fff}
.topbtn.pri{background:var(--media);border-color:var(--media);color:#fff}
.topbtn.pri:hover{background:#346546}
.editable-rail{cursor:pointer}
.btn.xs{padding:3px 9px;font-size:.72rem}
.chk{display:flex;align-items:center;gap:7px;font-weight:500;font-size:.82rem;color:var(--text)}
.chk input{width:auto;margin:0}
.sovread{font-size:.8rem;color:var(--text);line-height:1.5;padding:7px 0}

.sovbar i{display:block;height:100%;background:var(--media)}
.donetag{display:inline-block;padding:3px 10px;border-radius:11px;background:#ececec;color:#8a8a8a;font-size:.72rem;font-weight:600;letter-spacing:.4px}
.cellinp{width:84px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:.8rem;background:#fcfcfa}
.cellinp:focus{border-color:var(--media);outline:none;background:#fff}
.cellinp.money{width:96px}
.cur{color:var(--mut);font-size:.8rem;margin-right:2px}
.r{text-align:right}
.stubtbl tbody tr{opacity:.62}
.revsec{border-top:1px solid var(--line)}
.revsec:first-of-type{border-top:none}
.revhead{display:flex;align-items:baseline;gap:10px;padding:12px 18px 6px}
.revhead b{font-size:.92rem}
.revtot{margin-left:auto;font-weight:700;font-size:.95rem}
.revsec.gratis .revhead b{color:var(--mut)}
.revcols{display:flex;align-items:stretch;padding:18px 6px 14px}
.rc{flex:1;padding:0 18px;min-width:0}
.rcl{font-size:.74rem;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700}
.rcv{font-size:1.6rem;font-weight:700;color:var(--text);margin:4px 0 2px;line-height:1.1}
.rc.off .rcv{color:var(--mut)}
.rcrule{width:0;align-self:stretch;margin:2px 0}
.rcrule.hard{border-left:2px solid var(--line)}
.rcrule.dot{border-left:2px dotted #c9c9c2}
@media(max-width:820px){.revcols{flex-wrap:wrap;gap:12px}.rcrule{display:none}.rc{flex:1 1 40%}}
.revtotal{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--media-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.revtotal > div{display:flex;flex-direction:column;gap:2px}
.revtotlbl{font-weight:700;font-size:.95rem;color:var(--text)}
.revtotbig{margin-left:auto;font-size:1.45rem;font-weight:700;color:var(--media)}
.revbar{height:5px;background:#ececeb;margin:0 18px 10px;border-radius:3px;overflow:hidden}

.revbar.billed i{background:var(--owned)}
.calbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.calslider{flex:1;min-width:180px;max-width:420px;accent-color:var(--media)}

.sp2{flex:1}

.vstep .btn{line-height:1;padding:2px 8px}
.calsel{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.76rem;background:#fff}
.bkg.gratisbk{opacity:.72;border-style:dashed}
.dangr{color:var(--rose)}

   1. Everything you add/edit in-app lives in browser memory only, until
      you click "Export data" → downloads media_data.json.
   2. Commit that file to dfa_birdseye/Media/media_data.json.
   3. On load, the app fetches that URL and overlays it on the embedded
      placeholder/imported data (loadGithubJson(), see bottom of file).

   updating orders at the same time, audit trail, permissions), that
   requires an actual backend — a small database behind an API, not a
   flat file. Not built here; flag it if usage grows to that point.

   CONFIG.dataSource='github' and publish a workbook at

/* ═══════════════ helpers ═══════════════ */
var $ = function(s){ return document.querySelector(s); };
function nk(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function usd(n){ return 'USD ' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtD(iso){ if(!iso)return ''; var p=iso.split('-'); return p[1]+'/'+p[2]+'/'+p[0]; }
function fmtRange(a,b){ return fmtD(a)+' to '+fmtD(b); }
function monthKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function monthLabel(y,m){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]+' '+y; }
/* "This month" means this month. The dashboard used to be pinned to July 2026
   from when it was built, so every figure on it quietly described the past. */
function nowY(){ return new Date().getFullYear(); }
function nowM(){ return new Date().getMonth()+1; }          // 1-12
function nowKey(){ return nowY()+'-'+String(nowM()).padStart(2,'0'); }
function nowMonShort(){ return MONTH_ABBR[nowM()-1].charAt(0)+MONTH_ABBR[nowM()-1].slice(1).toLowerCase(); }
/* 'YYYY-MM-DD' parses as UTC midnight while new Date(y,m,d) is local midnight,
   so comparing the two drifts by a day either side of a month boundary
   depending on the timezone. Compare plain day numbers instead. */
function dayNum(v){
  var p = String(v||'').slice(0,10).split('-');
  return Number(p[0])*10000 + Number(p[1])*100 + Number(p[2]);
}
function overlapsMonth(from,to,y,m){
  var last = new Date(y, m, 0).getDate();
  return dayNum(from) <= (y*10000 + m*100 + last) && dayNum(to) >= (y*10000 + m*100 + 1);
}
ORDERS.forEach(function(o){
  if(o.gratis === undefined) o.gratis = false;       // booked but never billed
  if(!o.contract) o.contract = null;                 // {name, url, at, by}
});
function orderBy(no){ return ORDERS.find(function(o){return o.no===no;}); }
/* An order is billable revenue unless it is explicitly gratis. */
function isGratis(o){ return !!o.gratis; }
function isBilled(o){ return !isGratis(o) && (o.dealStatus==='Billed' || o.dealStatus==='Paid'); }
function isBooked(o){ return !isGratis(o) && !isBilled(o) && o.status!=='Cancelled'; }
function assetBy(id){ return ASSETS.find(function(a){return a.id===id;}); }
function overlaps(aFrom,aTo,bFrom,bTo){ return aFrom<bTo && aTo>bFrom; }   // strict: a shared boundary day (handoff) is not a collision
/* One asset can only hold one booking per slot at a time. Finds the first
   slot (1..N) on this asset with no date-overlapping booking already in it;
   falls back to slot N (last slot) with a console warning if all are full. */
function findFreeSlot(assetId, dateFrom, dateTo){
  var a = assetBy(assetId); if(!a) return 1;
  var max = assetLoop(a);
  for(var s=1; s<=max; s++){
    var clash = BOOKINGS.some(function(b){ return b.assetId===assetId && b.slot===s && overlaps(b.dateFrom,b.dateTo,dateFrom,dateTo); });
    if(!clash) return s;
  }
  return 0;   // loop full for these dates — caller decides what to do

}
function pkgBy(id){ return PACKAGES.find(function(p){return p.id===id;}); }
function rateBy(id){ return RATE_CARDS.find(function(r){return r.id===id;}); }
function catPill(c){ var lbl=CATEGORIES[c]||c; var cls=c==='beauty'?'beauty':(c==='swt'?'swt':'wja'); return '<span class="pill '+cls+'">'+esc(lbl)+'</span>'; }
function statusPill(s){ var cls=s==='Active'?'active':(s==='Completed'?'completed':(s==='Cancelled'?'cancelled':'draft')); return '<span class="pill '+cls+'">'+esc(s)+'</span>'; }
function rail4(level, withLabel){
  // level 0..4 : 0=blank, 1=Not Received .. 4=Running
  var h='<span class="rail4">';
  for(var i=1;i<=4;i++){
    var f = level>=i ? ' f'+i : '';
    h += '<span class="d'+f+'"></span>';
    if(i<4) h += '<span class="l'+(level>i?' fl':'')+'"></span>';
  }
  h+='</span>';
  if(withLabel){
    var lbl = level>0 ? STATUS_STEPS[level-1] : 'No status';
    return '<span class="rail4wrap">'+h+'<span class="rail4lbl">'+lbl+'</span></span>';
  }
  return h;
}
function activityFor(no){ return ACTIVITY.filter(function(e){return e.orderNo===no;}).sort(function(a,b){return b.at<a.at?-1:1;}); }
function dealPill(d){ var c = DEAL_COLORS[d]||'#8a90a2'; return '<span class="dealpill" style="background:'+c+'">'+esc(d||'—')+'</span>'; }
function dealStepper(no, current){
  var stages = DEAL_STAGES.concat(['Cancelled']);
  return '<div class="dealwrap">'+stages.map(function(s){
    var on = s===current;
    var cls = 'dealstep'+(on?' on':'')+(on && s==='Cancelled'?' cancelled':'');
    var style = on && s!=='Cancelled' ? ' style="background:'+(DEAL_COLORS[s]||'#8a90a2')+'"' : '';
    return '<button class="'+cls+'"'+style+' onclick="setDealStatus('+no+',\''+s+'\')">'+esc(s)+'</button>';
  }).join('')+'</div>';
}
function setDealStatus(no, s){
  var o = orderBy(no); if(!o) return;
  o.dealStatus = s;
  logAct(no, 'Deal status → '+s);
  openOrder(no); render();
}
function feedHtml(events, showOrder){
  if(!events.length) return '<div class="empty">No activity yet.</div>';
  return '<div class="feed">'+events.map(function(e){
    var ord = showOrder && e.orderNo ? ' · <a class="lnk" href="#" onclick="openOrder('+e.orderNo+');return false">#'+e.orderNo+' '+esc((orderBy(e.orderNo)||{}).brand||'')+'</a>' : '';
    var to = e.to ? '<div class="ctx sm">to: '+e.to.map(esc).join(', ')+'</div>' : '';
    return '<div class="ev"><span class="evtag '+e.tag+'">'+e.tag+'</span><div>'+
      '<div class="meta">by <b>'+esc(e.by)+'</b> '+esc(e.at)+ord+'</div>'+
      '<div class="what">'+esc(e.what)+'</div>'+
      (e.ctx?'<div class="ctx">'+esc(e.ctx)+'</div>':'')+to+
    '</div></div>';
  }).join('')+'</div>';
}

function logAct(orderNo, what, ctx, tag){

   workbook, so it is stripped on the way out — media_data.json keeps what this

  return ASSETS.map(function(a){

}
function applyDb(db){
  if(!db || !db.orders) throw new Error('Not a media tracker data file');
  ORDERS = db.orders; BOOKINGS = db.bookings||[]; ARTWORKS = db.artworks||[]; ACTIVITY = db.activity||[];
  if(db.assets){
    ASSETS = db.assets;
    ASSETS.forEach(function(a){
      if(a.loop == null) a.loop = (a.slots && a.slots.length) || 10;
      if(a.rate === undefined) a.rate = null;
    });
  }
  ORDERS.forEach(function(o){
    if(o.gratis === undefined) o.gratis = false;
    if(!o.contract) o.contract = null;
  });
  if(db.rateCards) RATE_CARDS = db.rateCards;
  if(db.packages) PACKAGES = db.packages;
  if(db.promoSpaces) PROMO_SPACES = db.promoSpaces;
  ASSETS.forEach(function(a){ a.wb = null; });
  seedSpaces();  // media_data.json just replaced ASSETS — put the baked spaces back
  reconcile();
}
function exportData(){
  var a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(assembleDb(), null, 1));
  a.download = 'media_data.json';
  a.click();
  DIRTY = false; var d=$('#dirtyDot'); if(d) d.style.display='none';
}
function importData(input){
  var f = input.files && input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{ applyDb(JSON.parse(r.result)); closeDrawer(); render(); }
    catch(e){ alert('Could not read that file: '+e.message); }
  };
  r.readAsText(f);
  input.value = '';
}
function loadGithubJson(){
  // On startup, try to load the committed data file. Falls back to embedded placeholders.
  fetch(CONFIG.githubBase + 'Media/media_data.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(db){ applyDb(db); render(); console.log('Loaded media_data.json saved', db.savedAt, 'by', db.savedBy); })
    .catch(function(e){ console.log('No committed media_data.json yet — using placeholder data.', e.message); });
}

/* Reads the selected screens and the slot count, shows the resulting share of
   voice, and prices the booking off each screen's own monthly rate. */
/* Everything that can be rented — digital screens and physical activation
   spaces — grouped by store so a long list stays findable. Spec-only rows
   (the totem panels behind the Totems line) are left out: they are not
   separately bookable. */
function nbSpaceOptions(selId){
  var byStore = {}, order = [];
  spaces().slice().sort(function(a,b){
    return (isPhys(a)?1:0)-(isPhys(b)?1:0) || a.name.localeCompare(b.name);
  }).forEach(function(a){
    var k = a.location || 'Unassigned';
    if(!byStore[k]){ byStore[k] = []; order.push(k); }
    byStore[k].push(a);
  });
  order.sort();
  return order.map(function(st){
    var med = byStore[st].filter(function(a){ return !isPhys(a); });
    var phy = byStore[st].filter(isPhys);
    function grp(label, list){
      if(!list.length) return '';
      return '<optgroup label="'+esc(st+' — '+label)+'">'+list.map(function(a){
        return '<option value="'+a.id+'"'+(selId===a.id?' selected':'')+'>'+esc(a.name)+' ('+esc(a.code)+')'+
          (isPhys(a)?'':' · '+assetLoop(a)+' slots')+(a.rate?' · $'+Number(a.rate).toLocaleString()+'/mo':'')+'</option>';
      }).join('')+'</optgroup>';
    }
    return grp('screens', med) + grp('activation spaces', phy);
  }).join('');
}
function nbAssetsChanged(){
  var picked = Array.prototype.slice.call($('#nbAssets').selectedOptions).map(function(o){return o.value;});
  var slots = Math.max(1, Number($('#nbSlots').value||1));
  var el = $('#nbSov');
  if(!picked.length){ el.textContent = 'select a screen'; return; }
  var parts = picked.map(function(id){
    var a = assetBy(id); if(!a) return '';
    if(isPhys(a)) return esc(a.name)+': the whole space';   // nothing to share — it is not a loop
    var loop = assetLoop(a), n = Math.min(slots, loop);
    return esc(a.name)+': '+n+' of '+loop+' — '+Math.round(n/loop*100)+'%';
  }).filter(Boolean);
  el.innerHTML = parts.join('<br>');
  var vf = $('#nbValue');
  if(vf && !vf.dataset.touched){
    var total = picked.reduce(function(sum,id){
      var a = assetBy(id); if(!a || !a.rate) return sum;
      return sum + Number(a.rate) * (isPhys(a) ? 1 : Math.min(slots, assetLoop(a)));
    }, 0);
    if(total) vf.value = total;
  }
}
function saveNewBooking(){
  var brand = $('#nbBrand').value.trim();
  var from = $('#nbFrom').value, to = $('#nbTo').value;
  if(!brand){ alert('Brand is required.'); return; }
  if(!from || !to || to < from){ alert('Check the dates — “To” must be on or after “From”.'); return; }
  var directAssets = Array.prototype.slice.call($('#nbAssets').selectedOptions).map(function(o){return o.value;});
  if(!directAssets.length){ alert('Select at least one screen.'); return; }
  var slotsWanted = Math.max(1, Number($('#nbSlots').value||1));
  var mon = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][Number(from.slice(5,7))-1];
  var firstAsset = assetBy(directAssets[0]);
  var kind = firstAsset && isPhys(firstAsset) ? ' Activation' : ' Media Rental';
  var name = $('#nbName').value.trim() || (brand.toUpperCase()+' '+mon+' '+from.slice(0,4)+
    (firstAsset ? ' - '+firstAsset.name+(directAssets.length>1?' +'+(directAssets.length-1):'')+kind : ''));
  var no = ORDERS.reduce(function(mx,o){return Math.max(mx,o.no);}, 1000) + 1;
  var o = {
    no:no, vst:'', brand:brand, brandCode:$('#nbBrandCode').value.trim(), name:name,
    promo:'', category:$('#nbCat').value,
    dateFrom:from, dateTo:to,
    owners:$('#nbOwners').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
    buyer:$('#nbBuyer').value.trim(),
    status:'Active', stage:'Proposal Draft', wfDone:0,
    dealStatus:$('#nbDeal').value,
    assignedValue:Number($('#nbValue').value||0), actualSold:Number($('#nbValue').value||0),
    margin:0, productionCost:0, installCost:0, contentStatus:0,
    brandEmails:$('#nbEmails').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
    gratis: !!($('#nbGratis') && $('#nbGratis').checked),
    contract: null,
    packageId:null
  };
  ORDERS.push(o);
  var booked = 0;
  directAssets.forEach(function(aid){
    var want = isPhys(assetBy(aid)) ? 1 : Math.min(slotsWanted, assetLoop(assetBy(aid)));
    for(var i=0;i<want;i++){
      var slot = findFreeSlot(aid, from, to);
      if(!slot) break;                       // screen full for these dates
      BOOKINGS.push({orderNo:no, assetId:aid, slot:slot, dateFrom:from, dateTo:to});
      booked++;
    }
  });
  logAct(no, 'Order created', booked+' slot(s) across '+directAssets.length+' screen(s)');
  closeModal();
  go('orders');
  openOrder(no);
}

        '<div class="rcrule dot"></div>'+
        '<div class="rc"><div class="rcl">Billed</div><div class="rcv money">'+money(billedTot)+'</div>'+
          '<div class="rcd mut sm">'+billed.length+' order'+(billed.length===1?'':'s')+' · '+share(billedTot)+'</div></div>'+
      '</div>'+

        '<span class="revtotbig money">'+money(total)+'</span></div>'+

        revTable(gratis,'No gratis placements.')+'</div>'+
      '<div class="revsec"><div class="revhead"><b>Booked</b><span class="mut sm">'+booked.length+' orders · '+share(bookedTot)+'</span><span class="revtot money">'+money(bookedTot)+'</span></div>'+
        '<div class="revbar"><i style="width:'+(total?bookedTot/total*100:0)+'%"></i></div>'+

      '<div class="revsec"><div class="revhead"><b>Billed</b><span class="mut sm">'+billed.length+' orders · '+share(billedTot)+'</span><span class="revtot money">'+money(billedTot)+'</span></div>'+

function ordersFiltered(){
  var f = STATE.orderFilters;
  return ORDERS.filter(function(o){
    if(f.status && o.status!==f.status) return false;
    if(f.category && o.category!==f.category) return false;
    if(f.buyer && o.buyer!==f.buyer) return false;
    if(f.gratis==='gratis' && !isGratis(o)) return false;
    if(f.gratis==='billable' && isGratis(o)) return false;
    if(f.deal && o.dealStatus!==f.deal) return false;
    if(f._kind==='artwork' && o.wfDone>=4) return false;
    if(f._kind==='photos' && o.wfDone!==4) return false;
    if(f.q){
      var q=f.q.toLowerCase();
      var hay=(o.no+' '+o.brand+' '+o.name+' '+o.promo+' '+o.buyer).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort(function(a,b){return b.no-a.no;});
}

/* ═══════════════ cross-tracker sync ═══════════════
   Content rail (0-4) and workflow checklist (0-6) must never disagree:
   a "Running" dot implies the creative pipeline is actually done, and
   a workflow step can't be marked done if the content isn't there yet.
   These tables are the single source of truth both directions clamp to. */
var CONTENT_MIN_WF = {0:0, 1:2, 2:3, 3:4, 4:6};   // min wfDone a content status requires
var WF_MAX_CONTENT  = {0:0, 1:0, 2:1, 3:2, 4:3, 5:3, 6:4}; // max content status a wfDone allows

var STAGE_BY_WF = ['Proposal Draft','Proposal Sent','Artwork Requested','Artwork Review','Scheduled / Photo Uploads','Wrap-up','Completed'];
/* Change how many slots of one screen an order holds — this is the share of
   voice control. Adding slots takes the next free ones; removing gives back
   the highest-numbered ones first. */
function changeSov(no, assetId){
  var a = assetBy(assetId); if(!a) return;
  var o = orderBy(no); if(!o) return;
  var loop = assetLoop(a), have = orderSlots(no, assetId).length;
  var want = prompt('Slots on '+a.name+' (loop holds '+loop+')\n'+
                    'Currently '+have+' = '+Math.round(have/loop*100)+'% share of voice.', have);
  if(want===null) return;
  want = Math.max(0, Math.min(loop, Math.round(Number(want)||0)));
  if(want===have) return;
  if(want < have){
    var drop = orderSlots(no, assetId).slice(want);
    BOOKINGS = BOOKINGS.filter(function(b){
      return !(b.orderNo===no && b.assetId===assetId && drop.indexOf(b.slot)>=0);
    });
  } else {
    for(var i=have;i<want;i++){
      var slot = findFreeSlot(assetId, o.dateFrom, o.dateTo);
      if(!slot){ alert(a.name+' has no free slot left for these dates — stopped at '+i+'.'); break; }
      BOOKINGS.push({orderNo:no, assetId:assetId, slot:slot, dateFrom:o.dateFrom, dateTo:o.dateTo});
    }
  }
  logAct(no, 'Share of voice changed on '+a.name, orderSlots(no,assetId).length+' of '+loop+' slots');
  markDirty(); openOrder(no); render();
}
function addAssetToOrder(no){
  var o = orderBy(no); if(!o) return;
  var choices = ASSETS.map(function(a,i){ return (i+1)+'. '+a.name+' ('+a.location+')'; }).join('\n');
  var pick = prompt('Add a screen to order #'+no+' — type its number:\n\n'+choices);
  if(pick===null) return;
  var a = ASSETS[Math.round(Number(pick))-1];
  if(!a){ alert('No screen with that number.'); return; }
  var slot = findFreeSlot(a.id, o.dateFrom, o.dateTo);
  if(!slot){ alert(a.name+' is fully booked for these dates.'); return; }
  BOOKINGS.push({orderNo:no, assetId:a.id, slot:slot, dateFrom:o.dateFrom, dateTo:o.dateTo});
  logAct(no, 'Screen added', a.name+' — slot '+slot);
  markDirty(); openOrder(no); render();
}

function toggleWf(no, i){
  var o = orderBy(no); if(!o) return;
  var was = o.wfDone;
  o.wfDone = (o.wfDone > i) ? i : i+1;      // click a done step → roll back to it; click an undone step → complete through it
  o.stage = STAGE_BY_WF[o.wfDone] || o.stage;
  o.contentStatus = Math.min(o.contentStatus, WF_MAX_CONTENT[o.wfDone]);   // can't stay "Running" if workflow rolled back
  var step = WORKFLOW_STEPS[Math.max(o.wfDone,was)-1] || WORKFLOW_STEPS[0];
  logAct(no, o.wfDone>was ? step : ('Reverted: '+step));
  openOrder(no); render();
}
function cycleContent(no){
  var o = orderBy(no); if(!o) return;
  o.contentStatus = (o.contentStatus+1) % 5;
  o.wfDone = Math.max(o.wfDone, CONTENT_MIN_WF[o.contentStatus]);   // advancing content pulls the workflow forward with it
  o.stage = STAGE_BY_WF[o.wfDone] || o.stage;
  logAct(no, 'Content status → '+(o.contentStatus>0?STATUS_STEPS[o.contentStatus-1]:'cleared'));
  openOrder(no); render();
}

    var allApproved = ARTWORKS.filter(function(x){return x.orderNo===o.no;}).every(function(x){return x.status==='Approved';});
    if(allApproved && o.wfDone<4){ o.wfDone=4; o.stage=STAGE_BY_WF[4]; }
    if(o.contentStatus<3) o.contentStatus=3;
  }
  logAct(a.orderNo, 'Artwork approved', a.file);
  openOrder(a.orderNo); render();
}

/* ═══════════════ calendar ═══════════════ */
function calMonths(){
  var out=[], y=STATE.cal.fromY, m=STATE.cal.fromM;
  for(var i=0;i<STATE.cal.months;i++){ out.push({y:y,m:m}); m++; if(m>12){m=1;y++;} }
  return out;
}
function openPromoCal(promo){ closeDrawer(); STATE.cal.mode='promo'; STATE.cal.highlight=promo; go('cal'); }
function setCalMode(m){ STATE.cal.mode=m; render(); }
/* The calendar window is driven by one slider rather than step buttons.
   Index 0 = Jan 2026; the range covers two plan years. */
var CAL_BASE_Y = 2026, CAL_SPAN = 24;
function calIndex(){ return (STATE.cal.fromY-CAL_BASE_Y)*12 + (STATE.cal.fromM-1); }
function setCalIndex(i){
  i = Math.max(0, Math.min(CAL_SPAN-1, Math.round(Number(i)||0)));
  STATE.cal.fromY = CAL_BASE_Y + Math.floor(i/12);
  STATE.cal.fromM = (i%12)+1;
  render();
}
function shiftCal(d){ setCalIndex(calIndex()+d); }
function toggleCalBooked(){ STATE.cal.bookedOnly = !STATE.cal.bookedOnly; render(); }
function shiftSlots(d){
  STATE.cal.slotFrom = Math.max(1, (STATE.cal.slotFrom||1) + d);
  render();
}
function setSlotWindow(n){ STATE.cal.slotWin = Math.max(1, Number(n)||4); STATE.cal.slotFrom = 1; render(); }

function vCal(){
  var months = calMonths();
  var head = '<div class="pgtitle"><h1>Calendar</h1><span class="sub">'+monthLabel(months[0].y,months[0].m)+' – '+monthLabel(months[months.length-1].y,months[months.length-1].m)+'</span>'+
    '<span class="calmode"><button class="'+(STATE.cal.mode==='promo'?'on':'')+'" onclick="setCalMode(\'promo\')">Promotions</button><button class="'+(STATE.cal.mode==='asset'?'on':'')+'" onclick="setCalMode(\'asset\')">Assets &amp; slots</button></span></div>'+
    '<div class="filters calbar">'+
      '<button class="btn ghost xs" onclick="shiftCal(-1)">‹</button>'+
      '<input class="calslider" type="range" min="0" max="'+(CAL_SPAN-1)+'" value="'+calIndex()+'" oninput="setCalIndex(this.value)" title="Drag to move the window">'+
      '<button class="btn ghost xs" onclick="shiftCal(1)">›</button>'+
      '<span class="calnow sm mut">'+monthLabel(months[0].y,months[0].m)+'</span>'+
      (STATE.cal.mode==='asset'
        ? '<span class="sp2"></span><button class="btn '+(STATE.cal.bookedOnly?'pri':'ghost')+' xs" onclick="toggleCalBooked()">Booked only</button>'+
          '<span class="slotwin sm mut">Slots '+(STATE.cal.bookedOnly?'with bookings':(STATE.cal.slotFrom||1)+'–'+((STATE.cal.slotFrom||1)+(STATE.cal.slotWin||4)-1))+'</span>'+
          '<span class="vstep"><button class="btn ghost xs" onclick="shiftSlots(-(STATE.cal.slotWin||4))" '+(STATE.cal.bookedOnly?'disabled':'')+'>▲</button>'+
          '<button class="btn ghost xs" onclick="shiftSlots(STATE.cal.slotWin||4)" '+(STATE.cal.bookedOnly?'disabled':'')+'>▼</button></span>'+
          '<select class="calsel" onchange="setSlotWindow(this.value)" '+(STATE.cal.bookedOnly?'disabled':'')+'>'+
            [2,4,6,10].map(function(n){return '<option value="'+n+'"'+(n===(STATE.cal.slotWin||4)?' selected':'')+'>'+n+' slots</option>';}).join('')+'</select>'
        : '')+
    '</div>';
  return head + (STATE.cal.mode==='promo' ? promoCal(months) : assetCal(months));
}

function promoCal(months){
  var ths = months.map(function(mm){return '<th>'+monthLabel(mm.y,mm.m)+'</th>';}).join('');
  var rows = PROMO_SPACES.map(function(sp){
    var hl = STATE.cal.highlight===sp.id ? ' style="outline:2px solid var(--media)"' : '';
    var cells = months.map(function(mm){
      var os = ORDERS.filter(function(o){ return o.promo===sp.id && overlapsMonth(o.dateFrom,o.dateTo,mm.y,mm.m); });
      var inner = os.map(function(o){
        var cls = o.wfDone>=4 ? '' : ' pending';
        return '<div class="bkg'+cls+'" onclick="openOrder('+o.no+')"><span class="bn">'+esc(o.brand)+'</span> <span class="st">#'+o.no+'</span><br><span class="st">'+esc(o.stage)+'</span></div>';
      }).join('');
      return '<td>'+inner+'</td>';
    }).join('');
    return '<tr'+hl+'><td class="spacehead">'+esc(sp.id)+'<span class="loc">'+esc(sp.loc)+'</span></td>'+cells+'</tr>';
  }).join('');
  return '<div class="card calwrap"><table class="cal"><thead><tr><th style="width:130px">Promo space</th>'+ths+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function assetCal(months){
  var ths = months.map(function(mm){return '<th>'+monthLabel(mm.y,mm.m)+'</th>';}).join('');
  var win = STATE.cal.slotWin || 4, from = STATE.cal.slotFrom || 1;
  var inWindow = function(a, slot){
    if(STATE.cal.bookedOnly){
      return BOOKINGS.some(function(b){
        return b.assetId===a.id && b.slot===slot && months.some(function(mm){ return overlapsMonth(b.dateFrom,b.dateTo,mm.y,mm.m); });
      });
    }
    return slot >= from && slot < from + win;
  };
  var shown = ASSETS.map(function(a){
    var slots = [];
    for(var i=1;i<=assetLoop(a);i++) if(inWindow(a,i)) slots.push(i);
    return {a:a, slots:slots};
  }).filter(function(x){ return x.slots.length; });

  if(!shown.length) return '<div class="card"><div class="empty">'+
    (STATE.cal.bookedOnly ? 'Nothing booked in this window — widen the months or turn the Booked filter off.'
                          : 'No slots in this range. Use ▲▼ to move the slot window.')+'</div></div>';

  var body = shown.map(function(x){
    var a = x.a;
    var head = '<tr><td class="assetcell" rowspan="'+(x.slots.length+1)+'"><span class="an" style="cursor:pointer" onclick="openAsset(\''+a.id+'\')">'+esc(a.name)+'</span><div class="ac">'+esc(a.division)+' › '+esc(a.location)+'</div><div class="ac"><b>Code:</b> '+esc(a.code)+' · '+esc(a.type)+'</div><div class="ac">'+assetLoop(a)+' slots'+(a.rate?' · $'+Number(a.rate).toLocaleString()+'/mo':'')+'</div></td>'+
      months.map(function(){return '<td style="background:#f4f4f0"></td>';}).join('')+'</tr>';
    var slotRows = x.slots.map(function(si){
      var cells = months.map(function(mm){
        var bs = BOOKINGS.filter(function(b){ return b.assetId===a.id && b.slot===si && overlapsMonth(b.dateFrom,b.dateTo,mm.y,mm.m); });
        return '<td>'+bs.map(function(b){ var o=orderBy(b.orderNo)||{};
          var pct = sovPct(b.orderNo, a.id);
          return '<div class="bkg'+(o.gratis?' gratisbk':'')+'" onclick="openOrder('+b.orderNo+')"><span class="bn">'+esc(o.brand||'')+'</span><br><span class="st">'+pct+'% SOV'+(o.gratis?' · gratis':'')+'</span></div>';
        }).join('')+'</td>';
      }).join('');
      return '<tr><td class="slotlbl"><b>Slot '+si+'</b><br><span class="so">of '+assetLoop(a)+'</span></td>'+cells+'</tr>';
    }).join('');
    return head + slotRows;
  }).join('');
  return '<div class="card calwrap"><table class="cal slotcal"><thead><tr><th style="width:230px">Screen</th>'+ths+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

function setAssetRate(id, v){
  var a = assetBy(id); if(!a) return;
  a.rate = (v===''||v==null) ? null : Number(v);
  markDirty(); render();
}
function setAssetLoop(id, v){
  var a = assetBy(id); if(!a) return;
  var n = Math.max(1, Math.round(Number(v)||1));
  var taken = BOOKINGS.filter(function(b){ return b.assetId===id && b.slot>n; });
  if(taken.length && !confirm('Shrinking the loop to '+n+' would strand '+taken.length+' booked slot(s). Continue and free them?')) { render(); return; }
  BOOKINGS = BOOKINGS.filter(function(b){ return !(b.assetId===id && b.slot>n); });
  a.loop = n; a.slots = slotLabels(a);
  markDirty(); render();
}
function addScreen(){
  $('#modalTitle').textContent = 'Add screen';
  var locs = [];
  ASSETS.forEach(function(a){ if(locs.indexOf(a.location)<0) locs.push(a.location); });
  $('#modalBody').innerHTML =
  '<div class="formgrid">'+
    '<div class="f"><label>Screen name *</label><input id="asName" placeholder="e.g. Digital Pylon"></div>'+
    '<div class="f"><label>Screen ID / code *</label><input id="asCode" placeholder="matches SCREEN ID on the map sheet"></div>'+
    '<div class="f"><label>Location</label><select id="asLoc">'+locs.map(function(l){return '<option>'+esc(l)+'</option>';}).join('')+'</select></div>'+
    '<div class="f"><label>Type</label><select id="asType">'+ASSET_TYPES.map(function(t){return '<option>'+esc(t)+'</option>';}).join('')+'</select></div>'+
    '<div class="f"><label>Slots in loop</label><input id="asLoop" type="number" min="1" step="1" value="10"></div>'+
    '<div class="f"><label>Rate (USD / month)</label><input id="asRate" type="number" min="0" step="50" placeholder="leave blank until priced"></div>'+
  '</div>'+
  '<div class="formfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveScreen()">Add screen</button></div>';
  $('#modalWrap').classList.add('open');
}
function saveScreen(){
  var name = $('#asName').value.trim(), code = $('#asCode').value.trim();
  if(!name || !code){ alert('Name and code are both needed — the code is what links this screen to the map sheet.'); return; }
  var loc = $('#asLoc').value;
  var id = (loc+'-'+code).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(assetBy(id)){ alert('A screen with that code already exists at '+loc+'.'); return; }
  var a = {id:id, name:name, code:code, location:loc, division:loc, type:$('#asType').value,
           loop:Math.max(1,Math.round(Number($('#asLoop').value||10))),
           rate:$('#asRate').value===''?null:Number($('#asRate').value), notes:''};
  a.slots = slotLabels(a);
  ASSETS.push(a);
  markDirty(); closeModal(); render();
}
function removeScreen(id){
  var a = assetBy(id); if(!a) return;
  var bk = BOOKINGS.filter(function(b){return b.assetId===id;}).length;
  if(!confirm('Remove '+a.name+'?'+(bk?'\n'+bk+' booking row(s) on it will go too.':''))) return;
  BOOKINGS = BOOKINGS.filter(function(b){return b.assetId!==id;});
  ASSETS = ASSETS.filter(function(x){return x.id!==id;});
  markDirty(); render();
}

/* ═══════════════ github data loader (opt-in) ═══════════════ */
function loadGithubData(){
  // Loads CONFIG.githubXlsx via SheetJS and replaces the embedded arrays.
  // Sheets: Orders, Assets, Bookings, RateCards, Packages, Activity, Artworks.
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = function(){
    fetch(CONFIG.githubXlsx).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
    .then(function(buf){
      var wb = XLSX.read(buf, {type:'array'});   // no cellDates — dates parsed as serials, converted UTC
      // TODO: map sheets → ORDERS / ASSETS / BOOKINGS / RATE_CARDS / PACKAGES / ACTIVITY / ARTWORKS.
      // Excel serial date → ISO: new Date(Date.UTC(1899,11,30) + serial*86400000).toISOString().slice(0,10)
      console.log('Workbook loaded:', wb.SheetNames);
      render();
    })
    .catch(function(e){ console.warn('GitHub data load failed, staying on embedded data:', e); });
  };
  s.onerror = function(){ console.warn('SheetJS CDN blocked — bundle xlsx.full.min.js inline for locked-down networks.'); };
  document.head.appendChild(s);
}

/* ═══════════════ map workbook ═══════════════
   The map app reads DFA_Master_Template_All_NAM.xlsx. Bookings made here are
   written into its Media Rentals tab — one row per slot, brand name in the
   month column, content status in that month's Status column — so anything
   booked here shows on the map. The workbook is rewritten and downloaded;
   commit it to dfa_birdseye/Activations/ to publish. Direct write-back needs
   somewhere that accepts writes, which GitHub Pages is not.
   ═════════════════════════════════════════════ */
var MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

/* The spreadsheet library comes from a CDN, which some networks block. A
   background load must fail quietly into a visible state rather than alert or
   hang — nothing here depends on it except reading and writing .xlsx. */
function withSheetJs(cb, onfail){
  if(window.XLSX) return cb();
  var sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload = cb;
  sc.onerror = function(){
    if(onfail) onfail('the spreadsheet library could not be loaded — this network may block the CDN');
    else alert('Could not load the spreadsheet library (CDN blocked on this network).');
  };
  document.head.appendChild(sc);
}

/* One row per booked slot, shaped like the map workbook's Media Rentals tab:
   SCREEN ID, then a brand column and a status column for each month. The rows
   are keyed by SCREEN ID and slot number, which is exactly how that tab already
   stores two slots on one screen (LED18 sits on two rows today). */
function mapRentalRows(){
  var head = ['SCREEN ID','SCREEN NAME','STORE','TYPE','SLOT','SHARE OF VOICE','ORDER','BILLING'];
  MONTH_ABBR.forEach(function(m){ head.push(m); head.push(m+' Status'); });
  var out = [head];

  var keyed = {};
  BOOKINGS.forEach(function(b){
    var o = orderBy(b.orderNo), a = assetBy(b.assetId);
    if(!o || !a || o.status==='Cancelled' || isPhys(a) || isChild(a)) return;
    var k = a.code+'::'+b.slot;
    if(!keyed[k]) keyed[k] = {a:a, slot:b.slot, months:{}};
    var fromM = Number(o.dateFrom.slice(5,7))-1, toM = Number(o.dateTo.slice(5,7))-1;
    var fromY = Number(o.dateFrom.slice(0,4)), toY = Number(o.dateTo.slice(0,4));
    for(var m=0;m<12;m++){
      if((fromY<2026 || m>=fromM) && (toY>2026 || m<=toM)){
        keyed[k].months[m] = {
          brand: o.brand,
          status: orderComplete(o) ? 'Completed' : (o.contentStatus>0 ? STATUS_STEPS[o.contentStatus-1] : ''),
          order: o.no,
          gratis: o.gratis,
          sov: sovPct(o.no, a.id)
        };
      }
    }
  });

  Object.keys(keyed).sort().forEach(function(k){
    var e = keyed[k], last = null;
    var row = [e.a.code, e.a.name, e.a.location, e.a.type, e.slot, '', '', ''];
    MONTH_ABBR.forEach(function(_, m){
      var v = e.months[m];
      row.push(v ? v.brand : '');
      row.push(v ? v.status : '');
      if(v) last = v;
    });
    if(last){ row[5] = last.sov+'%'; row[6] = '#'+last.order; row[7] = last.gratis ? 'Gratis' : 'Billable'; }
    out.push(row);
  });
  return out;
}

/* Downloads the update as its own workbook rather than rewriting
   DFA_Master_Template_All_NAM.xlsx in place. A browser spreadsheet library
   reads values but not formatting, so saving the master from here would strip
   the fills, fonts and column widths off every tab in it. This file carries
   the same SCREEN ID + slot keys, so the rows drop straight into the Media
   Rentals tab — by hand, or by sending this file to be merged. */
/* The Save file is JSON because it round-trips exactly — orders, bookings,
   slots, activity and all. This is the readable version: three sheets anyone
   can open, for sharing or for pasting into a deck. It does not import back. */
function exportXlsx(){
  withSheetJs(function(){
    var wb = XLSX.utils.book_new();

    var oRows = [['Order','Brand','Name','Category','From','To','Screens','Deal','Status','Content','Billing','Value','Contract']];
    ORDERS.slice().sort(function(a,b){ return a.dateFrom<b.dateFrom?-1:1; }).forEach(function(o){
      oRows.push([o.no, o.brand, o.name, CATEGORIES[o.category]||o.category, o.dateFrom, o.dateTo,
        screensSummary(o.no), o.dealStatus, o.status,
        orderComplete(o) ? 'Completed' : (o.contentStatus>0 ? STATUS_STEPS[o.contentStatus-1] : 'Not started'),
        o.gratis ? 'Gratis' : 'Billable', Number(o.actualSold||0), o.contract ? o.contract.name : '']);
    });
    var ows = XLSX.utils.aoa_to_sheet(oRows);
    ows['!cols'] = [{wch:8},{wch:20},{wch:42},{wch:12},{wch:12},{wch:12},{wch:30},{wch:12},{wch:11},{wch:13},{wch:10},{wch:12},{wch:22}];
    XLSX.utils.book_append_sheet(wb, ows, 'Orders');

    var bRows = [['Screen','Screen ID','Location','Slot','Loop','Share of voice','Order','Brand','From','To','Billing']];
    BOOKINGS.slice().sort(function(x,y){ return (x.assetId+x.slot) < (y.assetId+y.slot) ? -1 : 1; }).forEach(function(b){
      var a = assetBy(b.assetId), o = orderBy(b.orderNo);
      if(!a || !o) return;
      bRows.push([a.name, a.code, a.location, b.slot, assetLoop(a), sovPct(o.no, a.id)+'%',
        o.no, o.brand, b.dateFrom, b.dateTo, o.gratis ? 'Gratis' : 'Billable']);
    });
    var bws = XLSX.utils.aoa_to_sheet(bRows);
    bws['!cols'] = [{wch:18},{wch:18},{wch:11},{wch:6},{wch:6},{wch:15},{wch:8},{wch:20},{wch:12},{wch:12},{wch:10}];
    XLSX.utils.book_append_sheet(wb, bws, 'Bookings');

    var rRows = [['Screen','Screen ID','Location','Type','Slots in loop','Rate (USD/month)']];
    ASSETS.slice().sort(function(a,b){ return (a.location+a.name).localeCompare(b.location+b.name); }).forEach(function(a){
      rRows.push([a.name, a.code, a.location, a.type, assetLoop(a), a.rate==null ? '' : Number(a.rate)]);
    });
    var rws = XLSX.utils.aoa_to_sheet(rRows);
    rws['!cols'] = [{wch:18},{wch:20},{wch:11},{wch:14},{wch:13},{wch:17}];
    XLSX.utils.book_append_sheet(wb, rws, 'Rate Card');

    XLSX.writeFile(wb, 'DFA_Media_Tracker.xlsx');
    logAct(0, 'Exported to xlsx', (oRows.length-1)+' orders, '+(bRows.length-1)+' booked slots');
  });
}

/* Physical bookings in the shape of the workbook's Activations tab: one row
   per space, the booked brand in each month. Keyed on MAP ID, which the
   workbook's own Guide says must match the map exactly. */
function physActivationRows(){
  var out = [['MAP ID','SPACE NAME','STORE'].concat(MONTH_ABBR)];
  spaces().filter(isPhys).forEach(function(a){
    var row = [a.code, a.name, a.location], any = false;
    for(var m=1;m<=12;m++){
      var c = bkCell(a, BK.y, m);
      var t = c.orders.map(function(o){ return o.brand; }).join(' + ');
      if(t) any = true;
      row.push(t);
    }
    if(any) out.push(row);
  });
  return out;
}
function sendToMap(){
  withSheetJs(function(){
    var rows = mapRentalRows();
    var act = physActivationRows();
    if(rows.length < 2 && act.length < 2){ alert('Nothing to send — no bookings on the board yet.'); return; }
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:18},{wch:18},{wch:12},{wch:12},{wch:7},{wch:15},{wch:9},{wch:10}]
      .concat(MONTH_ABBR.reduce(function(acc){ return acc.concat([{wch:18},{wch:13}]); }, []));
    XLSX.utils.book_append_sheet(wb, ws, 'Media Rentals Update');
    if(act.length > 1){
      var aws = XLSX.utils.aoa_to_sheet(act);
      aws['!cols'] = [{wch:24},{wch:28},{wch:11}].concat(MONTH_ABBR.map(function(){ return {wch:18}; }));
      XLSX.utils.book_append_sheet(wb, aws, 'Activations Update');
    }
    XLSX.writeFile(wb, 'Media_Rentals_update.xlsx');
    alert('Media_Rentals_update.xlsx downloaded — '+(rows.length-1)+' screen row(s)'+
      (act.length>1 ? ' and '+(act.length-1)+' activation row(s)' : '')+'.\n\n'+
      'Keyed on SCREEN ID and MAP ID exactly as the master keys them. Paste each sheet over the '+
      'month columns of its tab, or run merge_to_workbook.py on the master to write the cells in '+
      'place with the formatting untouched.\n\n'+
      'Then commit DFA_Master_Template_All_NAM.xlsx to dfa_birdseye/Activations/.');
    logAct(0, 'Bookings exported for the map', (rows.length-1)+' slot rows');
  });
}

var WB = null;              // parsed workbook: {media:[], phys:[], at:'', err:''}

/* Workbook SCREEN IDs that do not match a screen code here. Kept in one
   place so a rename on either side is a one-line fix, not a silent gap. */
var ID_ALIAS = { 'pylon':'DIGITAL_PYLON_SFO_G' };

/* A Media Rentals row is the rentable line when its SCREEN ID is also its
   SCREEN NAME (LED18, totems). Rows that carry another line's name are the
   physical screens behind it — DGX_201-208 are the eight totem panels sold
   as one "Totems" line — so they are specs, never their own bookable space. */
function childOfParent(code, name){
  var c = nk(code), n = nk(name);
  return c !== n && !!assetBy2(n) ? assetBy2(n).id : null;
}
function assetBy2(codeKey){
  for(var i=0;i<ASSETS.length;i++) if(nk(ASSETS[i].code)===codeKey) return ASSETS[i];
  return null;
}
/* A code is only unique within a store, so prefer the one in the right store
   and fall back to a code-only match for rows whose STORE is blank. */
function assetByCodeStore(codeKey, store){
  var hit = null;
  for(var i=0;i<ASSETS.length;i++){
    var a = ASSETS[i];
    if(nk(a.code)!==codeKey) continue;
    if(store && nk(a.location)===nk(store)) return a;
    if(!hit) hit = a;
  }
  return store ? (hit && !hit.wb ? hit : hit) : hit;
}
function physSlug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function isPhys(a){ return !!a && a.kind==='physical'; }
function isChild(a){ return !!a && !!a.parentId; }
/* Everything that can actually be sold: screens and physical spaces, minus
   the spec-only rows folded into a parent line. */
function spaces(){ return ASSETS.filter(function(a){ return !isChild(a); }); }

function wbCell(v){ return String(v==null?'':v).trim(); }
function wbMonthCols(hdr){
  var m = {};
  hdr.forEach(function(v,j){
    var u = wbCell(v).toUpperCase();
    if(u.length<=4){ var k = MONTH_ABBR.indexOf(u.slice(0,3)); if(k>=0 && u.length===3 && m[k]==null) m[k]=j; }
  });
  return m;
}
function wbCols(hdr){
  var o = {};
  hdr.forEach(function(v,j){ var u = wbCell(v).toUpperCase().replace(/[.\s_\/]/g,''); if(o[u]==null) o[u]=j; });
  return function(names){ for(var i=0;i<names.length;i++) if(o[names[i]]!=null) return o[names[i]]; return -1; };
}
function wbHeaderRow(rows){
  for(var i=0;i<Math.min(rows.length,8);i++){
    var r = rows[i]||[];
    for(var j=0;j<r.length;j++){ var u = wbCell(r[j]).toUpperCase(); if(u==='MAP ID'||u==='SCREEN ID') return i; }
  }
  return 2;
}
/* The Video/VM status columns sit immediately right of a month column. */
function wbStatusAfter(hdr, mj){
  var out = [];
  for(var j=mj+1;j<Math.min(hdr.length,mj+4);j++){
    var u = wbCell(hdr[j]).toUpperCase();
    if(MONTH_ABBR.indexOf(u.slice(0,3))>=0 && u.length<=4) break;
    if(/STATUS/.test(u)) out.push(j);
  }
  return out;
}
function contentFromStatus(vals){
  var t = vals.join(' ').toLowerCase();
  if(/running|live|on air/.test(t)) return 4;
  if(/schedul/.test(t)) return 3;
  if(/receiv/.test(t)) return 2;
  return 0;
}

function parseWorkbookRows(wb, tab){
  var ws = wb.Sheets[tab]; if(!ws) return null;
  var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  var hi = wbHeaderRow(rows), hdr = rows[hi]||[], col = wbCols(hdr), mCol = wbMonthCols(hdr);
  var iId = col(['MAPID','SCREENID']), iNm = col(['SPACENAME','SCREENNAME','NAME']), iSt = col(['STORE']),
      iZn = col(['ZONEDEPT','ZONE','DEPT']), iSq = col(['SQUAREFT','SQUAREFEET','SQFT']),
      iTy = col(['TYPE']), iSp = col(['SPEC','DIMENSIONS']),
      iRent = col(['RENT','MONTHLYRENT','RENTPERMONTH','RENTALINCOME']);
  var sCol = {}; Object.keys(mCol).forEach(function(m){ sCol[m] = wbStatusAfter(hdr, mCol[m]); });
  var out = {}, order = [];
  for(var r=hi+1;r<rows.length;r++){
    var row = rows[r]||[], id = wbCell(row[iId]);
    if(!id || /^✈/.test(id)) continue;
    var name = wbCell(row[iNm]) || id;
    /* The same MAP ID is reused across stores — CHPP exists at SFO A, SFO G
       and LAX — so a space is identified by store AND id, never id alone. */
    var key = nk(wbCell(row[iSt])) + '|' + nk(id) + '|' + nk(name);
    var e = out[key];
    if(!e){
      var rent = iRent>=0 ? parseFloat(String(row[iRent]).replace(/[^0-9.\-]/g,'')) : NaN;
      e = out[key] = { tab:tab, code:id, name:name, store:wbCell(row[iSt]), zone:iZn>=0?wbCell(row[iZn]):'',
        sqft:iSq>=0?(parseFloat(String(row[iSq]).replace(/[^0-9.\-]/g,''))||null):null,
        type:iTy>=0?wbCell(row[iTy]):'', spec:iSp>=0?wbCell(row[iSp]):'',
        rent:(isNaN(rent)||rent<=0)?null:rent, rows:[], lines:[] };
      order.push(key);
    }
    e.rows.push(r+1);
    /* Each sheet row under one SCREEN ID is one slot on that screen — that is
       how LED18 already carries two bookings and LED19 three. */
    var line = { slot:e.lines.length+1, row:r+1, plan:{} };
    for(var m=0;m<12;m++){
      var j = mCol[m]; if(j==null) continue;
      var b = wbCell(row[j]); if(!b) continue;
      line.plan[m] = { brand:b, content:contentFromStatus((sCol[m]||[]).map(function(k){ return wbCell(row[k]); })) };
    }
    e.lines.push(line);
  }
  return order.map(function(k){ return out[k]; });
}

/* Put every baked space into ASSETS. Anything media_data.json already knows
   keeps its own rate, loop and slot labels — the sheet describes the space,
   this app owns what it costs. */
function seedSpaces(){
  BAKED_SPACES.forEach(function(b){
    var a = assetBy(b.id);
    if(!a){
      a = { id:b.id, rateCard:null, rate:null, slots:null };
      ASSETS.push(a);
    }
    a.name = b.name; a.code = b.code; a.location = b.location; a.division = b.location;
    a.type = b.type; a.kind = b.kind; a.zone = b.zone;
    a.parentId = b.parentId || null;
    if(b.sqft != null) a.sqft = b.sqft;
    if(b.spec) a.spec = b.spec;
    if(a.loop == null) a.loop = b.loop;
    if(b.kind === 'physical'){ a.loop = 1; a.slots = ['Space']; }
    else if(!a.slots){ a.slots = []; for(var i=1;i<=assetLoop(a);i++) a.slots.push('Slot '+i); }
  });
  ASSETS.forEach(function(a){ if(!a.kind) a.kind='media'; if(a.parentId===undefined) a.parentId=null; });
}
function loadWorkbook(then){
  if(WB_STATE==='loading') return;
  WB_STATE = 'loading'; render();
  var fail = function(msg){ WB_STATE='error'; WB={media:[],phys:[],at:'',err:msg}; render(); };
  withSheetJs(function(){
    fetch(CONFIG.githubBase + CONFIG.workbook, {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
      .then(function(ab){
        var wb = XLSX.read(new Uint8Array(ab), {type:'array'});
        WB = { media: parseWorkbookRows(wb,'Media Rentals')||[],
               phys:  parseWorkbookRows(wb,'Activations')||[],
               at: nowStamp(), err:'' };
        WB_STATE = 'ok';
        reconcile();
        render();
        if(then) then();
      })
      .catch(function(e){ fail(e.message); });
  }, fail);
}

/* Fold the workbook into ASSETS: attach the plan to screens that already
   exist, add physical activation spaces, and flag anything unmatched rather
   than dropping it. Safe to run again — it never duplicates. */
function reconcile(){
  if(!WB) return;
  WB.unmatched = [];
  WB.media.forEach(function(e){
    var code = ID_ALIAS[nk(e.code)] || e.code;
    var a = assetByCodeStore(nk(code), e.store);
    if(!a){
      if(childOfParent(e.code, e.name)) return;     // spec row behind a line we already have
      WB.unmatched.push({ what:'screen', code:e.code, name:e.name, store:e.store, rows:e.rows,
        note:'In the spreadsheet but not in this app. Re-bake the space list to add it.' });
      return;
    }
    a.wb = e;
    if(e.rent!=null && a.rate==null) a.rate = e.rent;
  });
  WB.phys.forEach(function(e){
    var a = assetBy('phys-' + physSlug(e.store) + '-' + physSlug(e.code));
    if(!a){
      WB.unmatched.push({ what:'space', code:e.code, name:e.name, store:e.store, rows:e.rows,
        note:'In the spreadsheet but not in this app. Re-bake the space list to add it.' });
      return;
    }
    a.wb = e;
    if(e.rent!=null && a.rate==null) a.rate = e.rent;   // a rate typed here wins over the sheet
  });
}

/* The plan on a space for one month, from whichever sheet row owns it. */
function planAt(a, m, slot){
  if(!a || !a.wb) return null;
  var ln = a.wb.lines[(slot||1)-1] || a.wb.lines[0];
  return ln ? (ln.plan[m]||null) : null;
}
function planAny(a, m){
  if(!a || !a.wb) return null;
  for(var i=0;i<a.wb.lines.length;i++){ var p = a.wb.lines[i].plan[m]; if(p) return p; }
  return null;
}

/* ═══════════════ sync from the workbook ═══════════════
   Turns planned brand-months into real orders. Nothing is written until
   you press Apply, and every row it cannot place is listed instead of
   being dropped. Run it again whenever the workbook changes: orders it
   already created are matched by their workbook key, never duplicated. */
function mFirst(y,m){ return y+'-'+String(m+1).padStart(2,'0')+'-01'; }
function mLast(y,m){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(new Date(y,m+1,0).getDate()).padStart(2,'0'); }

function coveringOrders(assetId, slot, y, m){
  return BOOKINGS.filter(function(b){
    if(b.assetId!==assetId || b.slot!==slot || !bkIn(b,y,m+1)) return false;
    var o = orderBy(b.orderNo); return o && o.status!=='Cancelled';
  }).map(function(b){ return orderBy(b.orderNo); });
}
function buildSync(){
  var y = BK.y, add = [], match = [], differ = [], extra = [], noRate = {};
  /* Scoped to whatever the booking calendar is showing, so a sync is a
     deliberate act on one store or one kind of space — not 800 orders at once. */
  var scope = bkScope();
  /* Compared brand by brand across a whole space-month, never slot by slot.
     The spreadsheet records which brands are on a space; how many slots each
     one holds lives only here, and a screen often has fewer sheet rows than
     slots — DG_01 is one row and ten slots. Lining those up by position
     invents drift that is not there. */
  scope.forEach(function(a){
    if(!a.wb) return;
    for(var m=0;m<12;m++){
      var sheet = {}, sheetAt = {};
      a.wb.lines.forEach(function(ln){
        var p = ln.plan[m]; if(!p) return;
        var k = nk(p.brand);
        if(!sheet[k]){ sheet[k] = p.brand; sheetAt[k] = {slot:ln.slot, row:ln.row, content:p.content}; }
      });
      var here = {}, hereOrder = {};
      for(var sl=1; sl<=assetLoop(a); sl++){
        coveringOrders(a.id, sl, y, m).forEach(function(o){
          var k = nk(o.brand); if(!here[k]){ here[k] = o.brand; hereOrder[k] = o; }
        });
      }
      var sk = Object.keys(sheet), hk = Object.keys(here);
      var onlySheet = sk.filter(function(k){ return !here[k]; });
      var onlyHere  = hk.filter(function(k){ return !sheet[k]; });
      sk.forEach(function(k){ if(here[k]) match.push({a:a, m:m, brand:sheet[k]}); });
      onlySheet.forEach(function(k){
        var at = sheetAt[k];
        var row = { a:a, slot:at.slot, m:m, brand:sheet[k], content:at.content, wbRow:at.row,
                    key:a.wb.tab+'|'+a.code+'|'+at.slot+'|'+m };
        if(onlyHere.length) { row.have = onlyHere.map(function(x){ return hereOrder[x]; }); differ.push(row); }
        else { add.push(row); if(a.rate==null) noRate[a.id] = a.name; }
      });
      if(onlyHere.length && !onlySheet.length)
        extra.push({ a:a, m:m, orders:onlyHere.map(function(k){ return hereOrder[k]; }) });
    }
  });
  return { add:add, match:match, differ:differ, extra:extra, noRate:noRate, year:y, scope:scope };
}

function applySync(){
  if(!SYNC) return;
  var y = SYNC.year, made = 0;
  var no = ORDERS.reduce(function(mx,o){ return Math.max(mx,o.no); }, 3000);
  /* One order per brand per space per unbroken run of months, so a brand
     running Oct-Dec is one order with one value, not three. */
  var byRun = {};
  SYNC.add.forEach(function(r){
    var k = r.a.id+'|'+r.slot+'|'+nk(r.brand);
    (byRun[k]||(byRun[k]=[])).push(r);
  });
  Object.keys(byRun).forEach(function(k){
    var rows = byRun[k].sort(function(x,z){ return x.m-z.m; }), run = [];
    rows.forEach(function(r){
      if(run.length && r.m === run[run.length-1].m+1) run.push(r);
      else { if(run.length) emit(run); run = [r]; }
    });
    if(run.length) emit(run);
  });
  function emit(run){
    var a = run[0].a, slot = run[0].slot, brand = run[0].brand;
    var from = mFirst(y, run[0].m), to = mLast(y, run[run.length-1].m);
    var rate = Number(a.rate||0), val = rate * run.length;
    no++;
    ORDERS.push({
      no:no, vst:'', brand:brand, brandCode:'',
      name: brand.toUpperCase()+' '+MONTH_ABBR[run[0].m]+(run.length>1?'–'+MONTH_ABBR[run[run.length-1].m]:'')+' '+y+' - '+a.name+(isPhys(a)?' Activation':' Media Rental'),
      promo:'', category:'beauty', dateFrom:from, dateTo:to, owners:[], buyer:'',
      status: to < todayIso() ? 'Completed' : 'Active',
      stage: STAGE_BY_WF[Math.min(run[0].content, STAGE_BY_WF.length-1)]||'Proposal Draft',
      wfDone: run[0].content>=4 ? 4 : 0,
      dealStatus:'Proposed', assignedValue:val, actualSold:val,
      margin:0, productionCost:0, installCost:0, contentStatus:run[0].content,
      brandEmails:[], gratis:false, contract:null, packageId:null,
      source:'workbook', wbKey:run[0].key, needsReview:true
    });
    BOOKINGS.push({ orderNo:no, assetId:a.id, slot:slot, dateFrom:from, dateTo:to });
    made++;
  }
  logAct(0, 'Synced from the workbook', made+' order(s) created from '+SYNC.add.length+' planned brand-month(s)');
  markDirty();
  SYNC = null;
  closeModal();
  go('book');
  alert(made+' order(s) created from the workbook.\n\nThey are marked "needs review" at $0 where the space has no rate. Set rates on the Rate Card page, then Export data to save them to media_data.json.');
}
function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ═══════════════ booking calendar ═══════════════
   Every rentable space — screens and physical activation spaces — down the
   side, the year across the top. Booked, planned, or open, in one grid. */
var BK = { y:nowY()>=CAL_BASE_Y&&nowY()<=CAL_BASE_Y+1 ? nowY() : CAL_BASE_Y,
           m:nowM(), view:'year', store:'', type:'', show:'brand' };
function bkSet(k,v){ BK[k] = (k==='y'||k==='m') ? Number(v) : v; render(); }
function bkSetView(v){ BK.view = v; render(); }
function bkDays(from,to){
  return Math.round((Date.UTC(+to.slice(0,4),+to.slice(5,7)-1,+to.slice(8,10)) -
                     Date.UTC(+from.slice(0,4),+from.slice(5,7)-1,+from.slice(8,10)))/864e5) + 1;
}
function bkOverlapDays(b,y,m){
  var first = y+'-'+String(m).padStart(2,'0')+'-01';
  var last  = y+'-'+String(m).padStart(2,'0')+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
  var f = b.dateFrom>first ? b.dateFrom : first, t = b.dateTo<last ? b.dateTo : last;
  return f>t ? 0 : bkDays(f,t);
}
/* A booking counts in a month once it has more than a day in it. Handing a
   screen over on the 30th does not make that a month's booking — orders
   2002 and 2003 meet on June 30 and only one of them owns June. */
function bkIn(b,y,m){
  var d = bkOverlapDays(b,y,m);
  return d>=2 || (d===1 && bkDays(b.dateFrom,b.dateTo)<=1);
}
function bkValue(b,y,m){
  var o = orderBy(b.orderNo); if(!o || o.gratis || o.status==='Cancelled') return 0;
  var n = BOOKINGS.filter(function(x){ return x.orderNo===b.orderNo; }).length || 1;
  var total = Number(o.actualSold||o.assignedValue||0);
  return total/n * bkOverlapDays(b,y,m) / bkDays(b.dateFrom,b.dateTo);
}
function bkFm(v){ if(!v) return '$0'; return v>=1000 ? '$'+(Math.round(v/100)/10)+'k' : '$'+Math.round(v); }
function bkScope(){
  return spaces().filter(function(a){
    if(BK.store && a.location!==BK.store) return false;
    if(BK.type==='media' && isPhys(a)) return false;
    if(BK.type==='phys' && !isPhys(a)) return false;
    return true;
  }).sort(function(a,b){
    return (isPhys(a)?1:0)-(isPhys(b)?1:0) || a.location.localeCompare(b.location) || a.name.localeCompare(b.name);
  });
}
function bkCell(a,y,m){
  var bks = BOOKINGS.filter(function(b){
    if(b.assetId!==a.id || !bkIn(b,y,m)) return false;
    var o = orderBy(b.orderNo); return o && o.status!=='Cancelled';
  });
  var orders = [], seen = {};
  bks.forEach(function(b){ if(!seen[b.orderNo]){ seen[b.orderNo]=1; orders.push(orderBy(b.orderNo)); } });
  var val = bks.reduce(function(s,b){ return s+bkValue(b,y,m); },0);
  var slots = {}; bks.forEach(function(b){ slots[b.slot]=1; });
  var p = planAny(a, m-1);
  var booked = bks.length>0;
  return { a:a, bks:bks, orders:orders, value:val, slots:Object.keys(slots).length,
           booked:booked, planned:!booked && !!p, occupied:booked || !!p, plan:p?p.brand:'' };
}
function bkBook(c,y,m){
  var last = new Date(y,m,0).getDate();
  return "openNewBooking({assetId:'"+c.a.id+"',brand:'"+esc(c.plan).replace(/'/g,'&#39;')+"',dateFrom:'"+
    y+'-'+String(m).padStart(2,'0')+"-01',dateTo:'"+y+'-'+String(m).padStart(2,'0')+'-'+String(last).padStart(2,'0')+"'})";
}
