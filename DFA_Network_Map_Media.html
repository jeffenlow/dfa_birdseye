function bkYear(scope){
  var y = BK.y, M = [];
  for(var m=1;m<=12;m++) M.push({n:0, occ:0, inc:0});
  var allStores = !BK.store;
  var grid = scope.map(function(a){
    var cells=[], yo=0, yv=0;
    for(var m=1;m<=12;m++){
      var c = bkCell(a,y,m); cells.push(c);
      var t = M[m-1]; t.n++;
      if(c.occupied){ t.occ++; yo++; }
      t.inc += c.value; yv += c.value;
    }
    return {a:a, cells:cells, yo:yo, yv:yv};
  });

  /* One booking, one slice. A screen sold to three brands is three slices of
     the month, not "A + B + C" crammed on one line — the slice is the unit
     you actually sell, and its height is its share of the screen's loop. */
  function slices(a, c, m){
    if(!c.booked){
      if(!c.planned) return '<div class="slice open">open</div>';
      return '<div class="slice plan" title="In the spreadsheet — the space is taken, but no priced order carries it.">'+
        '<div class="bn">'+esc(c.plan)+'</div><div class="bs">no order</div></div>';
    }
    var code = salesCode(a.location), loop = assetLoop(a);
    return c.orders.map(function(o){
      var mine = c.bks.filter(function(b){ return b.orderNo===o.no; });
      var slot = mine.length || 1;
      var val  = mine.reduce(function(s,b){ return s+bkValue(b,y,m); },0);
      var g    = brandGrowth(o.brand, code, m-1);
      var pick = g ? (BK.show==='lm' ? g.vsLM : g.vsLY) : null;
      var sub;
      if(BK.show==='rent') sub = o.gratis ? 'gratis' : (val ? bkFm(val) : 'no rate');
      else if(BK.show==='lm' || BK.show==='ly')
        // A figure with nothing to compare against gets no colour — an amber
        // chip reading "—" looks like a result, and it is the absence of one.
        sub = pick!=null ? '<span class="chip-g" style="background:'+heatGradient(pick)+'">'+fmtPct0(pick)+'</span>'
            : g ? '<span class="mut">no '+(BK.show==='lm'?'prior month':'last year')+'</span>'
            : (SALES_STATE==='loading' ? '…' : 'no report');
      else sub = isPhys(a) ? (val?bkFm(val):'whole space') : slot+'/'+loop+' slots';
      /* Height in proportion to the loop the booking holds, so a brand on 6
         of 10 slots is visibly bigger than one on 1 of 10. */
      var flex = isPhys(a) ? 1 : Math.max(1, slot);
      return '<div class="slice bkd'+(o.gratis?' gr':'')+'" style="flex:'+flex+
        (g&&pick!=null?';border-left-color:'+heatGradient(pick):'')+'" onclick="event.stopPropagation();openOrder('+o.no+')"'+
        ' title="'+esc(o.brand)+(g?' — '+salesFmt(g.mtd)+', '+fmtPct(g.vsLM)+' vs last month, '+fmtPct(g.vsLY)+' vs last year':' — no sales report for this month')+'">'+
        '<div class="bn">'+esc(o.brand)+'</div><div class="bs">'+sub+'</div></div>';
    }).join('');
  }

  var h = '<div class="card calwrap"><table class="cal bk"><thead><tr><th class="bkn">Space</th>'+
    MONTH_ABBR.map(function(n){ return '<th>'+n.charAt(0)+n.slice(1).toLowerCase()+'</th>'; }).join('')+
    '<th>Taken</th><th>Income</th></tr></thead><tbody>';
  var lastGrp = null;
  grid.forEach(function(r){
    var a = r.a, grp = isPhys(a) ? 'Physical activation spaces' : 'Media screens';
    if(grp!==lastGrp){
      lastGrp = grp;

      var bk = 0; g.forEach(function(x){ bk += x.yo; });
      h += '<tr class="bkgrp"><td class="bkn">'+grp+'</td><td colspan="14">'+g.length+' spaces · '+
        Math.round(bk/(g.length*12)*100)+'% of space-months taken</td></tr>';
    }
    h += '<tr><td class="bkn" onclick="openAsset(\''+a.id+'\')" title="'+esc(a.name)+' — '+esc(a.code)+'"><b>'+esc(a.name)+'</b>'+
      '<span class="bks">'+esc(a.location)+(isPhys(a)?'':' · '+assetLoop(a)+' slots')+(a.rate?' · $'+Number(a.rate).toLocaleString()+'/mo':' · no rate')+'</span></td>';
    r.cells.forEach(function(c,i){
      var m = i+1;
      h += '<td class="bkc'+(c.booked?' b':c.planned?' pl':' o')+'" onclick="'+(c.booked?'':bkBook(c,y,m))+'">'+
        '<div class="slices">'+slices(a,c,m)+'</div></td>';

  });

     brands in those spaces are growing. */
  var tot = M.reduce(function(s,t){ return {n:s.n+t.n, occ:s.occ+t.occ, inc:s.inc+t.inc}; }, {n:0,occ:0,inc:0});
  var BT = []; for(var m=0;m<12;m++) BT.push(brandsTotal(scope, y, m));
  var yr = brandsTotal(scope, y, new Date().getUTCMonth());
  function sumRow(lbl, f, last, note){

  h += sumRow('Rental income', function(t){ return t.inc?bkFm(t.inc):'—'; }, tot.inc?bkFm(tot.inc):'—');
  h += sumRow('Sales lift', function(t,i){ return growCell(BT[i].vsLM); },
              growCell(yr.vsLM), 'brands booked, vs last month');
  h += sumRow('Sales lift', function(t,i){ return growCell(BT[i].vsLY); },
              growCell(yr.vsLY), 'brands booked, vs last year');
  h += '</tbody></table></div>'+
    '<div class="bklegend"><span class="sw b"></span>Booked — one slice per booking, sized by the slots it holds '+
    '<span class="sw pl"></span>In the spreadsheet, no order yet '+
    '<span class="sw o"></span>Open. Click a slice for the order, an open cell to book it.<br>'+
    'Slice edges and lift chips use the map heat map\'s scale, saturating at ±5%. '+
    'Sales lift is the brands booked that month, counted once each per store — their sales across the whole store, not sales caused by the space. '+
    '<a class="lnk" href="#" onclick="go(\'health\');return false">Data health</a> · '+
    '<a class="lnk" href="DFA_Tracker.html#spaces" target="_blank">Value tracker</a> for sales split per space.</div>';
  return h;
}

function bkMonth(scope){

  var pl = cells.filter(function(c){return c.planned;}).length;

  var med = cells.filter(function(c){ return !isPhys(c.a); });
  var st = med.reduce(function(s,c){ return s+assetLoop(c.a); },0), sb = med.reduce(function(s,c){ return s+c.slots; },0);
  function k(v,t,d){ return '<div class="kpi" style="cursor:default"><div class="n">'+v+'</div><div class="t">'+t+'</div><div class="d mut">'+d+'</div></div>'; }
  var h = '<div class="kpis">'+
    k(n?Math.round(occ/n*100)+'%':'—','Fill rate', occ+' of '+n+' spaces taken')+
    k(n-occ,'Open','available to book · '+bk+' of the taken space'+(bk===1?'':'s')+' priced')+
    k(bkFm(inc),'Rental income', monthLabel(y,m)+', gratis excluded')+

    (st?k(Math.round(sb/st*100)+'%','Media slot fill', sb+' of '+st+' slots'):'')+

  h += '<div class="card"><table class="grid"><thead><tr><th>Space</th><th>Store</th><th>Status</th><th>Brand</th>'+
    '<th>Deal</th><th>Dates</th><th class="r">Brand sales</th><th class="r">vs LY</th><th class="r">This month</th></tr></thead><tbody>';
  var lastGrp = null;
  cells.forEach(function(c){
    var a = c.a, grp = isPhys(a) ? 'Physical activation spaces' : 'Media screens';
    if(grp!==lastGrp){ lastGrp = grp; h += '<tr class="bkgrp"><td colspan="9">'+grp+'</td></tr>'; }
    var nm = '<td class="b" style="cursor:pointer" onclick="openAsset(\''+a.id+'\')">'+esc(a.name)+
      '<div class="sm mut">'+esc(a.code)+(isPhys(a)?'':' · '+assetLoop(a)+' slots')+'</div></td><td class="sm">'+esc(a.location)+'</td>';
    if(!c.orders.length){
      h += '<tr class="rowlink" onclick="'+bkBook(c,y,m)+'">'+nm+
        '<td><span class="pill '+(c.planned?'draft':'cancelled')+'">'+(c.planned?'Taken, no order':'Open')+'</span></td>'+
        '<td>'+(c.planned ? esc(c.plan)+' <span class="mut sm">(workbook)</span>'
                          : '<span class="mut sm">'+(a.rate?'$'+Number(a.rate).toLocaleString()+'/mo at rate card':'click to book')+'</span>')+
        '</td><td></td><td></td><td class="r sm mut">—</td><td class="r sm mut">—</td><td class="r sm mut">—</td></tr>';
      return;
    }
    c.orders.forEach(function(o,i){
      var mine = c.bks.filter(function(b){ return b.orderNo===o.no; });
      var ov = mine.reduce(function(s,b){ return s+bkValue(b,y,m); },0);
      h += '<tr class="rowlink" onclick="openOrder('+o.no+')">'+(i===0?nm:'<td></td><td></td>')+
        '<td><span class="pill active">Booked</span></td>'+
        '<td class="b">'+esc(o.brand)+(isPhys(a)?'':'<div class="sm mut">'+mine.length+' of '+assetLoop(a)+' slots</div>')+'</td>'+
        '<td>'+dealPill(o.dealStatus)+'</td><td class="sm">'+fmtD(o.dateFrom)+'–'+fmtD(o.dateTo)+'</td>'+
        (function(){
          var r = brandMonth(o.brand, salesCode(a.location), m-1);
          if(!r) return '<td class="r sm mut">'+(SALES_STATE==='loading'?'…':'—')+'</td><td class="r sm mut">—</td>';
          var g = (r.ly>0?(r.s-r.ly)/r.ly:null);
          return '<td class="r sm money">'+salesFmt(r.s)+'</td>'+
                 '<td class="r sm money '+(g==null?'':(g>=0?'up':'down'))+'">'+fmtPct0(g)+'</td>';
        })()+
        '<td class="r sm money">'+(o.gratis?'gratis':(ov?bkFm(ov):'<span class="mut">no value</span>'))+'</td></tr>';
    });
  });
  return h+'</tbody></table></div>';
}

/* ═══════════════ brand sales ═══════════════
   The monthly sales reports, read straight from the repo. They are the same
   files the Value tracker and the map read — nothing is copied here.

   What this shows is the brand's sales ACROSS THE WHOLE STORE for the months
   a booking runs, not sales caused by the space. A brand on one screen is not
   the reason it sold; this is context for a conversation with the brand, not
   an attribution model. The Value tracker is where sales get split across the
   spaces a brand occupies and measured against a baseline. */
var SALES = {};              // code -> month -> brandKey -> {name,s,ly}
var SALES_TOTAL = {};        // code -> month -> {s,ly}
var SALES_STATE = 'idle';    // idle | loading | ok
var SALES_HAVE = [];

function salesCode(store){ return /LAX/i.test(String(store||'')) ? 'LAX' : 'SFO'; }
function salesPath(code,m){ return 'Sales/'+code+'_'+CAL_BASE_Y+'-'+String(m+1).padStart(2,'0')+'-full.xlsx'; }

function parseSalesSheet(ab, code, mi){
  var wb = XLSX.read(new Uint8Array(ab), {type:'array'});
  var ws = wb.Sheets[wb.SheetNames[0]]; if(!ws) return;
  var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  var hi = -1;
  for(var i=0;i<Math.min(rows.length,15);i++){
    if((rows[i]||[]).some(function(v){ return /^brand$/i.test(String(v).trim()); })){ hi=i; break; }
  }
  if(hi<0) return;
  var hdr = rows[hi], cB=-1, cM=-1, cLY=-1;
  hdr.forEach(function(v,j){
    var t = String(v).trim(), isVar = /var|%/i.test(t);
    if(/^brand$/i.test(t) && cB<0) cB=j;
    else if(!isVar && /mtd/i.test(t) && /\bly\b/i.test(t) && cLY<0) cLY=j;
    else if(!isVar && /mtd/i.test(t) && cM<0) cM=j;
  });
  if(cB<0 || cM<0) return;
  var tgt = SALES[code] || (SALES[code]={}); tgt[mi] = {};
  function num(v){ if(v==null||v==='') return null; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
  for(var r=hi+1;r<rows.length;r++){
    var row = rows[r]||[], b = String(row[cB]||'').trim();
    if(String(row[0]||'').trim().toLowerCase()==='total'){
      (SALES_TOTAL[code]||(SALES_TOTAL[code]={}))[mi] = {s:num(row[cM])||0, ly:cLY>=0?(num(row[cLY])||0):0};
      continue;
    }
    if(!b) continue;
    var s = num(row[cM]), ly = cLY>=0 ? num(row[cLY]) : null;
    if(s==null && ly==null) continue;
    tgt[mi][nk(b)] = {name:b, s:s||0, ly:ly||0};
  }
  SALES_HAVE.push(code+' '+MONTH_ABBR[mi].charAt(0)+MONTH_ABBR[mi].slice(1).toLowerCase());
}
function loadSales(){
  if(SALES_STATE!=='idle') return;
  SALES_STATE = 'loading';
  withSheetJs(function(){
    var jobs = [];
    ['SFO','LAX'].forEach(function(code){
      for(var m=0;m<12;m++) (function(m){
        jobs.push(fetch(CONFIG.githubBase + salesPath(code,m), {cache:'no-store'})
          .then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
          .then(function(ab){ parseSalesSheet(ab, code, m); })
          .catch(function(){ /* that month has not been published yet */ }));
      })(m);
    });
    Promise.all(jobs).then(function(){
      SALES_STATE = 'ok';
      SALES_HAVE.sort();
      render();
    });
  }, function(){ SALES_STATE = 'ok'; render(); });   // no library, no sales — say so rather than spin
}
/* The map's heat map resolves a booked brand to a sales row with the same
   three steps, in order: exact key, a known alias for the names that differ
   between the Activations sheet and the sales report, then a stem match for
   the rest. Ported as-is so a brand that reads +12% on the map reads +12%
   here. Keep BRAND_ALIASES in step with the map's copy. */
var BRAND_ALIASES = {
  'sf collection':'san francisco',
  'la collection':'los angeles',
  'tolberone':'toblerone',        // common misspelling in the Activations sheet
  'glenffidich':'glenfiddich',    // typo variant
  'john jameson':'jameson',       // alternate brand name
  'patron':'patron',
  'patrón':'patron',
  "stag's leap wine cellars":'stags leap wine cellars',
  'stags leap':'stags leap wine cellars'
};
function brandNormKey(s){
  return String(s||'').toLowerCase()
    .replace(/[àáâãäå]/g,'a').replace(/[èéêë]/g,'e')
    .replace(/[ìíîï]/g,'i').replace(/[òóôõö]/g,'o')
    .replace(/[ùúûü]/g,'u').replace(/[ñ]/g,'n')
    .replace(/[^a-z0-9]/g,'');
}
function brandMonth(brand, code, m){
  var d = (SALES[code]||{})[m];
  if(!d || !brand) return null;
  var key = brandNormKey(brand);
  if(d[key]) return d[key];
  var alias = BRAND_ALIASES[String(brand).toLowerCase().trim()];
  if(alias && d[brandNormKey(alias)]) return d[brandNormKey(alias)];
  var stem = key.substring(0, Math.min(key.length, 7));
  if(stem.length >= 4){
    for(var k in d){
      if(k.indexOf(stem)===0 || stem.indexOf(k.substring(0,stem.length))===0) return d[k];
    }
  }
  return null;
}
/* One brand, one store, one month: this month, against last month, against
   the same month last year — the three figures the heat map shows. */
function brandGrowth(brand, code, m){
  var cur = brandMonth(brand, code, m);
  if(!cur) return null;
  var prv = m>0 ? brandMonth(brand, code, m-1) : null;
  return {
    mtd: cur.s,
    ly: cur.ly,
    vsLM: (prv && prv.s && cur.s) ? (cur.s-prv.s)/prv.s : null,
    vsLY: (cur.ly && cur.s) ? (cur.s-cur.ly)/cur.ly : null
  };
}
/* The map's gradient: red below, amber at flat, green above, saturating at
   ±5%. Same scale, so the colours mean the same thing in both apps. */
function heatGradient(pct){
  var t = Math.max(-1, Math.min(1, (pct||0)/0.05)), r, g, b;
  if(t >= 0){ r=Math.round(232+(29-232)*t);  g=Math.round(168+(158-168)*t); b=Math.round(56+(117-56)*t); }
  else { var s=t+1;  r=Math.round(192+(232-192)*s); g=Math.round(57+(168-57)*s); b=Math.round(43+(56-43)*s); }
  return 'rgb('+r+','+g+','+b+')';
}
function fmtPct(p){ if(p==null) return '—'; return (p>=0?'+':'')+(p*100).toFixed(1)+'%'; }
function salesFmt(v){
  if(v==null) return '—';
  var a = Math.abs(v);
  return (v<0?'−':'')+(a>=1e6 ? '$'+(a/1e6).toFixed(2)+'M' : a>=1000 ? '$'+Math.round(a/1000)+'k' : '$'+Math.round(a));
}
function fmtPct0(p){ if(p==null) return '—'; return (p>=0?'+':'')+(p*100).toFixed(0)+'%'; }
/* Every brand booked across a set of spaces in one month, counted once per
   store — a brand on four screens is one brand, not four — summed this month,
   last month and the same month last year. */
function brandsTotal(list, y, m){
  var seen = {}, mtd=0, prv=0, ly=0, n=0, nPrv=0, nLy=0;
  list.forEach(function(a){
    var code = salesCode(a.location);
    bkCell(a, y, m+1).orders.forEach(function(o){
      var k = code+'|'+brandNormKey(o.brand);
      if(seen[k]) return;
      seen[k] = 1;
      var cur = brandMonth(o.brand, code, m); if(!cur) return;
      mtd += cur.s; n++;
      if(cur.ly){ ly += cur.ly; nLy++; }
      var p = m>0 ? brandMonth(o.brand, code, m-1) : null;
      if(p && p.s){ prv += p.s; nPrv++; }
    });
  });
  return { mtd:n?mtd:null, n:n,
           vsLM: (nPrv && prv) ? (mtd-prv)/prv : null,
           vsLY: (nLy && ly)  ? (mtd-ly)/ly   : null };
}

/* Every month an order runs, with the store it runs in. */
function orderMonths(no){
  var out = [];
  BOOKINGS.filter(function(b){ return b.orderNo===no; }).forEach(function(b){
    var a = assetBy(b.assetId); if(!a) return;
    for(var m=0;m<12;m++){
      if(!bkIn(b, CAL_BASE_Y, m+1)) continue;
      var k = salesCode(a.location)+'|'+m;
      if(out.indexOf(k)<0) out.push(k);
    }
  });
  return out.map(function(k){ var p=k.split('|'); return {code:p[0], m:Number(p[1])}; })
            .sort(function(x,y){ return x.m-y.m; });
}
/* The booked brand's store sales over the months this order runs. */
function orderSales(o){
  var ms = orderMonths(o.no), s=0, ly=0, n=0, miss=[];
  ms.forEach(function(x){
    var r = brandMonth(o.brand, x.code, x.m);
    if(!r){ miss.push(MONTH_ABBR[x.m]); return; }
    s += r.s; ly += r.ly; n++;
  });
  return { s:n?s:null, ly:n?ly:null, g:n?(ly>0?(s-ly)/ly:null):null, n:n, months:ms, missing:miss };
}
function salesCard(o){
  if(SALES_STATE==='loading') return '<div class="empty">Reading the sales reports…</div>';
  var r = orderSales(o);
  if(!r.n) return '<div class="empty">No sales report covers '+(r.months.length?'these months yet':'this order')+
    (r.missing.length?' ('+r.missing.join(', ')+')':'')+'.</div>';
  var g = r.g, cls = g==null ? '' : (g>=0 ? 'up' : 'down');
  return '<div class="grow"><div class="gv '+cls+'">'+fmtPct(g)+'</div>'+
    '<div class="gl">'+esc(o.brand)+' · '+r.n+' month'+(r.n===1?'':'s')+'</div></div>'+
    '<div class="kv">'+
      kvRow('Sales while booked', '<b>'+salesFmt(r.s)+'</b>')+
      kvRow('Same months last year', salesFmt(r.ly))+
      kvRow('Change', '<span class="'+cls+'">'+salesFmt(r.s-r.ly)+' · '+fmtPct(g)+'</span>')+
      kvRow('Months counted', r.months.map(function(x){ return MONTH_ABBR[x.m].charAt(0)+MONTH_ABBR[x.m].slice(1).toLowerCase(); }).join(', ')+
        (r.missing.length?' <span class="mut sm">(no report yet: '+r.missing.join(', ')+')</span>':''))+
    '</div>'+
    '<div class="sm mut" style="padding:0 18px 14px;line-height:1.6">The brand\'s sales across the whole store, not sales caused by this space. '+
    'Useful for the conversation with the brand; for sales split across the spaces a brand occupies and measured against a baseline, see the '+
    '<a class="lnk" href="DFA_Tracker.html#spaces" target="_blank">Value tracker</a>.</div>';
}

/* ═══════════════ push to the spreadsheet ═══════════════
   This tracker is the record. The workbook keeps a copy of the month columns
   so the map and the planning calendar keep working, and this is how that copy
   is refreshed. The export is value-only — a browser cannot write an .xlsx
   without stripping its fills, fonts and column widths — so it is a drop-in
   sheet to paste over, or a file to hand to the merge script, which edits the
   master in place and keeps every bit of its formatting. */
function openPush(){
  if(WB_STATE!=='ok'){ loadWorkbook(openPush); return; }
  var s = buildSync();
  var med = mapRentalRows().length-1, act = physActivationRows().length-1;
  $('#modalTitle').textContent = 'Update the spreadsheet';
  $('#modalBody').innerHTML =
    '<p class="mut" style="margin-bottom:12px">Every rental is booked here. The spreadsheet carries a copy of the month columns because the map and the planning calendar read it. This refreshes that copy.</p>'+
    '<div class="kpis" style="margin-bottom:14px">'+
      '<div class="kpi" style="cursor:default"><div class="n">'+med+'</div><div class="t">Media rows</div><div class="d mut">screen + slot</div></div>'+
      '<div class="kpi" style="cursor:default"><div class="n">'+act+'</div><div class="t">Activation rows</div><div class="d mut">one per space</div></div>'+
      '<div class="kpi" style="cursor:default"><div class="n" style="color:'+(s.extra.length?'var(--amber)':'inherit')+'">'+s.extra.length+'</div><div class="t">Waiting to be pushed</div><div class="d mut">booked here, not in the sheet</div></div>'+
    '</div>'+
    '<h3 style="font-size:.9rem;margin:14px 0 6px">Each month</h3>'+
    '<ol style="font-size:.84rem;line-height:1.9;margin-left:18px;color:#4c5468">'+
      '<li><b>Export data</b> — saves <code>media_data.json</code>. Commit it to <code>dfa_birdseye/Media/</code>. That is the record.</li>'+
      '<li><b>Download the update</b> below — two sheets, <i>Media Rentals Update</i> and <i>Activations Update</i>, keyed on SCREEN ID and MAP ID exactly as the master keys them.</li>'+
      '<li>Paste each one over the month columns of the matching tab, or run <code>merge_to_workbook.py</code> on the master — that writes the cells in place and leaves every fill, font and column width alone.</li>'+
      '<li>Commit the master to <code>dfa_birdseye/Activations/</code>. The map picks it up on the next load.</li>'+
    '</ol>'+
    '<div class="note" style="border-left:3px solid var(--media);background:var(--media-soft);padding:10px 12px;margin-top:12px;font-size:.82rem">'+
      'The sheet is written from here, never read back. If somebody types a booking straight into it, <b>Pull sheet edits</b> brings it in — and Data health keeps flagging it until you do.</div>'+
    '<div class="formfoot"><button class="btn ghost" onclick="closeModal()">Close</button>'+
      '<button class="btn ghost" onclick="exportData()">Export data (json)</button>'+
      '<button class="btn pri" onclick="closeModal();sendToMap()">Download the update</button></div>';
  $('#modalWrap').classList.add('open');
}

/* ═══════════════ init ═══════════════ */
if(CONFIG.dataSource==='github') loadGithubData();
seedSpaces();         // every rentable space, baked in — works with no network
loadWorkbook();       // optional: only to check the spreadsheet for drift
loadSales();          // monthly sales reports, for brand growth while booked
loadGithubJson();     // pick up committed edits from dfa_birdseye/Media/media_data.json (no-op if absent)
render();
if(/^#(book|health|cal|orders|assets|rates|dam|activity)$/.test(location.hash)) go(location.hash.slice(1));
</script>
</body>
</html>
